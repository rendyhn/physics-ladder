<style>
/* ---------- tokens ---------- */
:root {
  --bg: #F3F5F8; --paper: #FFFFFF; --sunken: #E9EDF3; --ink: #141B2B; --ink-2: #435067; --ink-3: #6B778C;
  --rule: #D3DAE4; --rule-soft: #E3E8EF; --grid: rgba(35, 64, 184, 0.06);
  --accent: #2340B8; --accent-2: #1A3194; --accent-soft: #E3E8FA; --on-accent: #FFFFFF;
  --good: #17774A; --good-soft: #DDF1E5; --bad: #B3261E; --bad-soft: #FBE3E0; --warn: #8F5200; --warn-soft: #FBEFD9;
  --lv1: #C2410C; --lv2: #0F766E; --lv3: #6D28D9; --lv4: #B91C1C; --lv5: #1D4ED8; --lv6: #946000; --lv7: #A21D4E; --lv8: #4D7C0F;
  --f-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --f-body: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
  --top: 56px; --side: 292px;
  --shadow: 0 1px 2px rgba(20, 27, 43, 0.05), 0 10px 30px -18px rgba(20, 27, 43, 0.35);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0E131B; --paper: #151C27; --sunken: #1B2331; --ink: #E7EBF2; --ink-2: #AEB8C8; --ink-3: #8390A4;
    --rule: #2A3446; --rule-soft: #212A39; --grid: rgba(143, 166, 255, 0.05);
    --accent: #8EA4FF; --accent-2: #B4C2FF; --accent-soft: #1E2847; --on-accent: #0E131B;
    --good: #5FCB8F; --good-soft: #15281E; --bad: #FF8E82; --bad-soft: #33191A; --warn: #F2B35C; --warn-soft: #2E2413;
    --lv1: #FB8B52; --lv2: #34CDB8; --lv3: #C4A5FF; --lv4: #FF8A80; --lv5: #8EB4FF; --lv6: #F2C14E; --lv7: #F58BB0; --lv8: #A3D96B;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 30px -18px rgba(0, 0, 0, 0.7);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0E131B; --paper: #151C27; --sunken: #1B2331; --ink: #E7EBF2; --ink-2: #AEB8C8; --ink-3: #8390A4;
  --rule: #2A3446; --rule-soft: #212A39; --grid: rgba(143, 166, 255, 0.05);
  --accent: #8EA4FF; --accent-2: #B4C2FF; --accent-soft: #1E2847; --on-accent: #0E131B;
  --good: #5FCB8F; --good-soft: #15281E; --bad: #FF8E82; --bad-soft: #33191A; --warn: #F2B35C; --warn-soft: #2E2413;
  --lv1: #FB8B52; --lv2: #34CDB8; --lv3: #C4A5FF; --lv4: #FF8A80; --lv5: #8EB4FF; --lv6: #F2C14E; --lv7: #F58BB0; --lv8: #A3D96B;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 30px -18px rgba(0, 0, 0, 0.7);
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16.5px/1.6 var(--f-body); }
a { color: var(--accent); }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.15; text-wrap: balance; margin: 0; color: var(--ink); }
code { font: 0.88em var(--f-mono); background: var(--sunken); padding: 0.1em 0.35em; border-radius: 4px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.print-only { display: none; }
svg { flex: none; }
.btn svg, .key-toggle svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
mjx-container { font-size: 104% !important; }
mjx-container[display="true"] { overflow-x: auto; overflow-y: hidden; max-width: 100%; padding-block: 2px; }
.fbm { font-family: 'Cambria Math', 'Times New Roman', serif; font-style: italic; white-space: nowrap; }
.fbm-d { display: block; text-align: center; margin: 0.6em 0; white-space: normal; }

/* ---------- top bar & shell ---------- */
.topbar {
  position: sticky; top: 0; z-index: 30; height: calc(var(--top) + env(safe-area-inset-top, 0px));
  padding: env(safe-area-inset-top, 0px) 16px 0; display: flex; align-items: center; gap: 12px;
  background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--rule);
}
.brand { display: flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; font: 800 1.2rem var(--f-display); letter-spacing: -0.01em; }
.brand svg { width: 28px; height: 28px; }
.brand small { font: 500 0.72rem var(--f-mono); color: var(--ink-3); letter-spacing: 0.04em; margin-inline-start: 4px; }
.menu-btn { display: none; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); border-radius: 8px; width: 40px; height: 40px; align-items: center; justify-content: center; cursor: pointer; }
.menu-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.shell { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); align-items: start; }
.sidebar {
  position: sticky; top: calc(var(--top) + env(safe-area-inset-top, 0px)); height: calc(100vh - var(--top) - env(safe-area-inset-top, 0px));
  overflow-y: auto; border-inline-end: 1px solid var(--rule); padding: 16px 12px 48px; background: var(--bg); scrollbar-width: thin;
}
.search { position: relative; margin-bottom: 14px; }
.search input { width: 100%; font: 15px var(--f-body); color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; padding: 9px 12px; }
.search input::placeholder { color: var(--ink-3); }
.nav-level + .nav-level { margin-top: 18px; }
.nav-level-title { display: flex; align-items: center; gap: 10px; font: 700 0.95rem var(--f-display); padding: 4px 6px 6px; }
.nav-level-title small { display: block; font: 500 0.7rem var(--f-mono); color: var(--ink-3); letter-spacing: 0.06em; text-transform: uppercase; }
.rung { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 5px; background: var(--lv); color: var(--paper); font: 700 0.75rem var(--f-mono); flex: none; }
.rung-lg { width: 36px; height: 36px; font-size: 1rem; border-radius: 8px; }
.nav-topics { list-style: none; margin: 0; padding: 0; }
.nav-topics a { display: flex; gap: 10px; align-items: baseline; padding: 5px 8px; border-radius: 6px; color: var(--ink-2); text-decoration: none; font-size: 0.92rem; line-height: 1.35; }
.nav-topics a:hover { background: var(--sunken); color: var(--ink); }
.nav-topics a[aria-current="page"] { background: var(--paper); color: var(--ink); box-shadow: inset 3px 0 0 var(--lv), var(--shadow); font-weight: 700; }
.nav-topics .num { font: 500 0.72rem var(--f-mono); color: var(--ink-3); min-width: 1.4rem; }
.nav-review { font-style: italic; }
.main { padding: 32px clamp(16px, 4vw, 56px) 96px; min-width: 0; }
.scrim { display: none; }

/* ---------- buttons & controls ---------- */
.btn { display: inline-flex; align-items: center; gap: 8px; font: 700 0.92rem var(--f-body); padding: 9px 16px; border-radius: 8px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); text-decoration: none; cursor: pointer; transition: background 0.15s, border-color 0.15s; }
.btn:hover { border-color: var(--ink-3); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
.btn-ghost { background: transparent; }
.btn-small { padding: 6px 12px; font-size: 0.85rem; }
.eyebrow { display: flex; align-items: center; gap: 10px; font: 500 0.76rem var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--lv, var(--accent)); margin: 0 0 12px; }
.lede { color: var(--ink-2); font-size: 1.08rem; max-width: 62ch; margin: 12px 0 0; }

/* ---------- home ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: clamp(24px, 4vw, 56px); align-items: center; max-width: 1180px; margin: 0 auto 48px; }
.hero h1 { font-size: clamp(2.1rem, 1.3rem + 3vw, 3.5rem); font-weight: 800; letter-spacing: -0.025em; }
.hero-cta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
.sample { background: var(--paper); border: 1px solid var(--rule); border-radius: 10px; padding: 20px 22px; box-shadow: var(--shadow); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 22px 22px; min-height: 200px; }
.sample-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.sample-label { font: 500 0.72rem var(--f-mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); }
.sample-topic { font: 600 0.78rem var(--f-mono); color: var(--lv); text-decoration: none; }
.sample-q { font-size: 1.05rem; }
.sample-choices { list-style: none; padding: 0; margin: 14px 0 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 8px; }
.sample-choices li { display: flex; align-items: center; gap: 10px; }
.sample-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.sample-ans { margin-top: 12px; border-top: 1px dashed var(--rule); }
.sample-answer { margin: 12px 0 4px; } .sample-sol { margin: 0; color: var(--ink-2); font-size: 0.95rem; }
.reveal.collapsed { height: 0; overflow: hidden; visibility: hidden; margin: 0; padding: 0; border: 0; }
.ladder { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); gap: 16px; }
.level { background: var(--paper); border: 1px solid var(--rule); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; }
.level-head { display: flex; gap: 12px; align-items: center; }
.level-head h2 { font-size: 1.25rem; }
.band { margin: 2px 0 0; font: 500 0.74rem var(--f-mono); color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.05em; }
.level-blurb { color: var(--ink-2); font-size: 0.93rem; margin: 12px 0; }
.level-topics { margin: 0 0 14px; padding-inline-start: 1.4em; padding-inline-end: 0; font-size: 0.93rem; flex: 1; }
.level-topics li { padding: 2px 0; } .level-topics li::marker { color: var(--ink-3); font: 0.8em var(--f-mono); }
.level-topics a { color: var(--ink); text-decoration: none; } .level-topics a:hover { color: var(--lv); text-decoration: underline; }
.level-review { font-weight: 700; color: var(--lv); text-decoration: none; font-size: 0.92rem; }

/* ---------- topic ---------- */
.topic { max-width: 880px; margin: 0 auto; }
.crumbs { display: flex; gap: 8px; font: 0.8rem var(--f-mono); color: var(--ink-3); margin-bottom: 18px; }
.crumbs a { color: var(--ink-3); }
.topic-head h1 { font-size: clamp(2rem, 1.4rem + 2.2vw, 3rem); font-weight: 800; letter-spacing: -0.02em; }
.topic-tabs { display: flex; gap: 4px; margin-top: 26px; border-bottom: 1px solid var(--rule); }
.topic-tabs a { padding: 10px 18px; font: 700 0.98rem var(--f-display); color: var(--ink-3); text-decoration: none; border-bottom: 3px solid transparent; margin-bottom: -1px; }
.topic-tabs a:hover { color: var(--ink); }
.topic-tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--lv); }
#panel { margin-top: 28px; }

/* ---------- lesson prose ---------- */
.lesson-tools { display: flex; justify-content: flex-end; margin: -12px 0 8px; }
.prose { max-width: 70ch; }
.rungs { max-width: 70ch; margin: 0 0 28px; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); }
.rungs summary { display: flex; align-items: center; gap: 8px; padding: 10px 14px; cursor: pointer; list-style: none; font: 600 0.78rem var(--f-mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-2); }
.rungs summary::-webkit-details-marker { display: none; }
.rungs summary .chev { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; transform: rotate(-90deg); transition: transform 0.2s; }
[dir="rtl"] .rungs summary .chev { transform: rotate(90deg); }
.rungs[open] summary .chev { transform: none; }
.rungs summary:hover { color: var(--ink); }
.rungs-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 24px; padding: 4px 16px 16px; }
.rungs-col ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.rungs-col li a { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; color: var(--ink); text-decoration: none; }
.rungs-col li a:hover span:last-child { color: var(--lv); text-decoration: underline; }
.rungs-col li p { margin: 3px 0 0; font-size: 0.9rem; line-height: 1.5; color: var(--ink-2); }
.rungs-empty { margin: 0; font-size: 0.9rem; color: var(--ink-3); }
@media (max-width: 640px) { .rungs-cols { grid-template-columns: minmax(0, 1fr); } }
.prose > p, .prose li { color: var(--ink); }
.prose h3 { font-size: 1.3rem; margin: 2em 0 0.5em; }
.prose h3:first-child { margin-top: 0; }
.prose ul, .prose ol { padding-inline-start: 1.3em; padding-inline-end: 0; }
.prose li + li { margin-top: 4px; }
.box { margin: 1.4em 0; padding: 14px 18px; border-radius: 8px; }
.box > :last-child { margin-bottom: 0; } .box > p:first-of-type { margin-top: 0; }
.box-label { font: 600 0.72rem var(--f-mono) !important; text-transform: uppercase; letter-spacing: 0.08em; margin: 0 0 6px !important; }
.box-key { background: var(--accent-soft); } .box-key .box-label { color: var(--accent); }
.box-ex { border: 1.5px dashed var(--rule); background: var(--paper); } .box-ex .box-label { color: var(--ink-3); }
.box-tip { background: var(--warn-soft); } .box-tip .box-label { color: var(--warn); }
.formula { margin: 1em 0; padding: 4px 8px; overflow-x: auto; }
.tbl-wrap { overflow-x: auto; margin: 1em 0; }
.tbl { border-collapse: collapse; font-size: 0.93rem; min-width: 100%; background: var(--paper); font-variant-numeric: tabular-nums; }
.tbl th, .tbl td { border: 1px solid var(--rule); padding: 7px 10px; text-align: start; vertical-align: middle; }
.tbl thead th, .tbl-q th { background: var(--sunken); font-weight: 700; }
.tbl-q { min-width: 0; width: auto; } .tbl-q td, .tbl-q th { text-align: center; }
.fig { margin: 1.4em 0; } .fig > svg { width: 100%; max-width: 520px; height: auto; display: block; }   /* direct child only: MathJax output in a caption is SVG too */
.fig figcaption { font-size: 0.85rem; color: var(--ink-3); margin-top: 6px; }
.fig-shape { fill: var(--accent-soft); stroke: var(--ink-2); stroke-width: 1.5; }
.fig-alpha { fill-opacity: 0.55; }
.fig-line { fill: none; stroke: var(--ink-2); stroke-width: 1.5; }
.fig-dash { stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 5 4; }
.fig-frame { fill: none; stroke: var(--rule); stroke-width: 1.5; }
.fig-sector { fill: var(--accent-soft); stroke: none; }
.fig-dot { fill: var(--ink); }
.fig-text { fill: var(--ink); font: italic 600 15px var(--f-body); }
.fig-small { fill: var(--ink-2); font: 12px var(--f-body); }
.lesson-foot { margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--rule); display: grid; gap: 20px; }
.lesson-foot > .btn { justify-self: start; }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pager a { display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); color: var(--ink); text-decoration: none; font-weight: 700; }
.pager a:hover { border-color: var(--ink-3); }
.pager small { font: 500 0.72rem var(--f-mono); color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.06em; }
.pager-next { text-align: end; }

/* ---------- worksheet ---------- */
.ws-controls { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: flex-end; margin-bottom: 18px; }
.ctrl { display: flex; flex-direction: column; gap: 6px; }
.ctrl-label { font: 600 0.72rem var(--f-mono); text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-3); }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; background: var(--paper); }
.seg-btn { font: 600 0.9rem var(--f-mono); border: 0; background: transparent; color: var(--ink-2); padding: 8px 13px; cursor: pointer; }
.seg-btn + .seg-btn { border-left: 1px solid var(--rule); }
.seg-btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
select { font: 15px var(--f-body); color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px; }
.ctrl-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-inline-start: auto; }
.sheet {
  background-color: var(--paper); border: 1px solid var(--rule); border-radius: 6px; box-shadow: var(--shadow);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px; padding: clamp(18px, 3.5vw, 40px);
}
.sheet-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px 24px; padding-bottom: 16px; border-bottom: 2px solid var(--ink); }
.kicker { font: 600 0.72rem var(--f-mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--lv, var(--ink-3)); margin: 0 0 4px; }
.sheet-title h2 { font-size: 1.6rem; }
.sheet-meta { display: flex; gap: 18px; margin: 0; align-self: flex-end; }
.sheet-meta div { display: flex; flex-direction: column; }
.sheet-meta dt { font: 500 0.66rem var(--f-mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); }
.sheet-meta dd { margin: 0; font: 600 0.92rem var(--f-mono); }
.sheet-note { font-size: 0.86rem; color: var(--ink-3); margin: 14px 0 0; }
.qs { list-style: none; margin: 0; padding: 0; }
.q { padding: 22px 0; border-bottom: 1px solid var(--rule-soft); }
.q-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
.q-num { display: inline-grid; place-items: center; min-width: 28px; height: 28px; padding: 0 6px; border-radius: 50%; border: 1.5px solid var(--ink); font: 700 0.85rem var(--f-mono); flex: none; }
.q-type, .q-topic { font: 500 0.7rem var(--f-mono); text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-3); }
.q-topic { color: var(--lv); }
.q-text { font-size: 1.04rem; overflow-x: auto; }
.q-text .tbl-wrap { margin: 10px 0; }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); gap: 8px; margin-top: 12px; }
.choice { position: relative; display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); cursor: pointer; transition: border-color 0.15s, background 0.15s; }
.choice:hover { border-color: var(--ink-3); }
.choice input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.choice-body { min-width: 0; overflow-x: auto; }
.letter { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--ink-3); font: 600 0.8rem var(--f-mono); color: var(--ink-2); flex: none; background: var(--paper); }
.choice.sel { border-color: var(--accent); background: var(--accent-soft); }

    for (let i = 0; i < 6; i++) d += ` L ${s0 + (i + 0.5) * 6} ${y1 + (i % 2 ? 7 : -7)}`;
    d += ` L ${s0 + zl} ${y1} H ${x2}`; lx = (x1 + x2) / 2; ly = y1 - 14;
  } else {
    const s0 = y1 + a; d = `M ${x1} ${y1} V ${s0}`;
    for (let i = 0; i < 6; i++) d += ` L ${x1 + (i % 2 ? 7 : -7)} ${s0 + (i + 0.5) * 6}`;
    d += ` L ${x1} ${s0 + zl} V ${y2}`; lx = x1 + 14; ly = (y1 + y2) / 2 + 5;

function battery(x, y1, y2, name) {
  const m = (y1 + y2) / 2;
  return `<path class="fig-wire" d="M ${x} ${y1} V ${m - 5} M ${x} ${m + 5} V ${y2}"/><line class="fig-wire" x1="${x - 16}" y1="${m - 5}" x2="${x + 16}" y2="${m - 5}"/><line class="fig-wire" style="stroke-width:4" x1="${x - 8}" y1="${m + 5}" x2="${x + 8}" y2="${m + 5}"/>` + txt(x - 22, m + 4, name, 'fig-small', 'end');
}
const wire = d => `<path class="fig-wire" d="${d}"/>`;
const node = (x, y) => `<circle class="fig-dot" cx="${x}" cy="${y}" r="3.2"/>`;
/* layout 'series': ε with R1…Rn in a loop; 'parallel': ε with R1…Rn side by side; 'mixed': R1 in series with (R2 ∥ R3) */
function circuitSvg(kind, names, emfName, label) {
  const W = 420, H = 230, L = 70, R = 380, Tp = 40, Bt = 200;
  let s = svgOpen(W, H, label) + battery(L, Tp, Bt, emfName);
  if (kind === 'series') {
    const n = names.length;
    if (n <= 2) {
      s += resistor(L, Tp, (L + R) / 2 + 10, Tp, names[0]) + wire(`M ${(L + R) / 2 + 10} ${Tp} H ${R} V ${Tp + 20}`);
      s += n === 2 ? resistor(R, Tp + 20, R, Bt - 20, names[1]) + wire(`M ${R} ${Bt - 20} V ${Bt} H ${L}`) : wire(`M ${R} ${Tp + 20} V ${Bt} H ${L}`);
    } else {
      const seg = (R - L) / 2;
      s += resistor(L, Tp, L + seg, Tp, names[0]) + resistor(L + seg, Tp, R, Tp, names[1]) + resistor(R, Tp, R, Bt, names[2]) + wire(`M ${R} ${Bt} H ${L}`);
    }
  } else if (kind === 'parallel') {
    const n = names.length, xs = names.map((_, i) => L + ((R - L) * (i + 1)) / n);
    s += wire(`M ${L} ${Tp} H ${R} M ${L} ${Bt} H ${R}`);
    xs.forEach((x, i) => { s += resistor(x, Tp, x, Bt, names[i]) + node(x, Tp) + node(x, Bt); });
  } else {   // mixed
    const xa = 250, xb = 360;
    s += resistor(L, Tp, 190, Tp, names[0]) + wire(`M 190 ${Tp} H ${xb} M ${L} ${Bt} H ${xb}`);
    s += resistor(xa, Tp, xa, Bt, names[1]) + resistor(xb, Tp, xb, Bt, names[2]) + node(xa, Tp) + node(xa, Bt);
  }
  return s + '</svg>';
}

/* ---------- vernier caliper: main scale in mm, vernier with 10 divisions over 9 mm (reads to 0.1 mm) ---------- */
function vernierSvg(reading, label) {
  const W = 460, H = 150, k = 12, x0 = 30;                     // 12 px per mm
  const whole = Math.floor(reading + 1e-9), tenth = Math.round((reading - whole) * 10);
  const start = Math.max(0, whole - 8), end = start + 34, X = mm => x0 + (mm - start) * k;
  let s = svgOpen(W, H, label) + `<rect class="fig-block" x="${x0 - 10}" y="20" width="${W - 40}" height="50" rx="3"/>`;
  for (let mm = start; mm <= end; mm++) {
    const len = mm % 10 === 0 ? 22 : mm % 5 === 0 ? 16 : 10;
    s += `<line class="fig-wire" style="stroke-width:1.2" x1="${X(mm)}" y1="70" x2="${X(mm)}" y2="${70 - len}"/>`;
    if (mm % 10 === 0) s += txt(X(mm), 42, String(mm / 10), 'fig-small');
  }
  s += txt(W - 22, 34, 'cm', 'fig-small', 'end');
  s += `<rect class="fig-shape" x="${X(reading) - 14}" y="70" width="${10 * 0.9 * k + 28}" height="44" rx="3"/>`;
  for (let i = 0; i <= 10; i++) {
    const x = X(reading + i * 0.9), len = i % 5 === 0 ? 18 : 11;
    s += `<line class="fig-wire" style="stroke-width:1.2${i === tenth ? ';stroke:var(--accent)' : ''}" x1="${x.toFixed(1)}" y1="70" x2="${x.toFixed(1)}" y2="${70 + len}"/>`;
    if (i % 5 === 0) s += txt(x, 104, String(i), 'fig-small');
  }
  return s + '</svg>';
}

/* ---------- a beam on supports with loads: items [{ x, kind: 'support' | 'load' | 'pivot', label }], x from 0 to L ---------- */
function beamSvg(L, items, label) {
  const W = 460, H = 170, x0 = 40, x1 = 420, y = 80, X = x => x0 + (x / L) * (x1 - x0);
  let s = svgOpen(W, H, label) + `<rect class="fig-block" x="${x0}" y="${y - 7}" width="${x1 - x0}" height="14" rx="2"/>`;
  for (const it of items) {
    const x = X(it.x);
    if (it.kind === 'support' || it.kind === 'pivot') s += `<polygon class="fig-shape" points="${x},${y + 7} ${x - 14},${y + 34} ${x + 14},${y + 34}"/>` + (it.label ? txt(x, y + 52, it.label, 'fig-small') : '');
    else s += arrow(x, y - 62, x, y - 9, it.arrow || 'a') + txt(x, y - 68, it.label, 'fig-small');
  }
  // distance ticks under the beam at every labelled item
  return s + `<line class="fig-dash" x1="${x0}" y1="${y + 62}" x2="${x1}" y2="${y + 62}"/>` + txt(x0, y + 78, '0', 'fig-small') + txt(x1, y + 78, `${F(L)} m`, 'fig-small') + '</svg>';
}

/* ---------- uniform circular motion: object on a circle with velocity (tangent) and centripetal acceleration ---------- */
function circleSvg(label) {
  const W = 300, H = 260, cx = 140, cy = 130, r = 95, a = rad(35), px = cx + r * Math.cos(a), py = cy - r * Math.sin(a);
  let s = svgOpen(W, H, label) + `<circle class="fig-line fig-dashed" cx="${cx}" cy="${cy}" r="${r}"/><circle class="fig-dot" cx="${cx}" cy="${cy}" r="3"/>`;
  s += `<line class="fig-dash" x1="${cx}" y1="${cy}" x2="${px.toFixed(1)}" y2="${py.toFixed(1)}"/>` + txt((cx + px) / 2 - 6, (cy + py) / 2 + 16, 'r');
  s += `<circle class="fig-block" cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="9"/>`;
  s += arrow(px, py, px - 70 * Math.sin(a), py - 70 * Math.cos(a), 'a') + tipLabel(px, py, px - 70 * Math.sin(a), py - 70 * Math.cos(a), 'v');
  s += arrow(px, py, px - 55 * Math.cos(a), py + 55 * Math.sin(a), 'b') + txt(px - 60 * Math.cos(a) + 4, py + 60 * Math.sin(a) + 20, 'a', 'fig-text', 'start');
  return s + '</svg>';
}

/* a sine wave y = A sin(2πx/λ) drawn to scale on labelled axes */
function waveSvg(lambda, A, span, { xl = 'x (m)', yl = 'y (cm)', label, xStep } = {}) {
  const pts = []; for (let i = 0; i <= 160; i++) { const x = span * i / 160; pts.push([x, A * Math.sin(2 * Math.PI * x / lambda)]); }
  return graphSvg(pts, { xMax: span, yMax: A * 1.25, yMin: -A * 1.25, xl, yl, xStep: xStep || lambda / 2, yStep: A, label, dots: false });
}

<p>A <b>physical quantity</b> is anything we can measure, and every measurement has two parts: a <b>number</b> and a <b>unit</b>. "The table is 1.5" means nothing; "the table is $1.5\,\mathrm{m}$ long" is a measurement.</p>
<h3>SI base units</h3>
<p>Scientists everywhere use the International System of Units (SI). It starts from seven base quantities:</p>
${siTable()}
<p>Every other unit is a <b>derived unit</b> built from these. Speed is distance divided by time, so its unit is $\mathrm{m/s}$. Force is mass times acceleration, so $1\,\mathrm{N} = 1\,\mathrm{kg\,m/s^2}$. Energy is force times distance, so $1\,\mathrm{J} = 1\,\mathrm{N\,m} = 1\,\mathrm{kg\,m^2/s^2}$.</p>
<h3>Prefixes</h3>
<p>Prefixes scale a unit up or down by powers of ten:</p>
${prefixTable()}
${Key(T`<p>To convert, multiply by a factor that equals 1. Since $1\,\mathrm{km} = 1000\,\mathrm{m}$,</p><p>$$3.2\,\mathrm{km} \times \frac{1000\,\mathrm{m}}{1\,\mathrm{km}} = 3200\,\mathrm{m}.$$</p><p>The unit you want goes on top, the unit you are removing goes underneath, and the old units cancel.</p>`)}
<h3>Squared and cubed units</h3>
<p>A square metre is a square $100\,\mathrm{cm}$ on each side, so $1\,\mathrm{m^2} = 100 \times 100 = 10\,000\,\mathrm{cm^2}$. For volumes the factor is cubed: $1\,\mathrm{m^3} = 1\,000\,000\,\mathrm{cm^3}$. Also $1\,\mathrm{L} = 1000\,\mathrm{cm^3}$ and $1\,\mathrm{m^3} = 1000\,\mathrm{L}$.</p>
<h3>Speeds: km/h and m/s</h3>

<p>So divide by 3.6 to go from km/h to m/s, and multiply by 3.6 to go back: $72\,\mathrm{km/h} = 20\,\mathrm{m/s}$.</p>
<h3>Scientific notation</h3>
<p>Very large and very small numbers are written as $a \times 10^n$ with $1 \le a \lt 10$. The speed of light is $3.0 \times 10^{8}\,\mathrm{m/s}$; the charge of an electron is $1.6 \times 10^{-19}\,\mathrm{C}$. In a calculator or on this site you can type these as <code>3e8</code> and <code>1.6e-19</code>.</p>

  lesson: () => T`
<p>No measurement is perfectly exact. A good measurement says how big something is <i>and</i> how precisely we know it.</p>
<h3>Instruments and their precision</h3>
${Tbl([T`Instrument`, T`Smallest reading`, T`Typical use`], [[T`Ruler`, Q(1, 'mm'), T`lengths of a few cm to 1 m`], [T`Vernier caliper`, Q(0.1, 'mm'), T`diameters, depths, thicknesses`], [T`Micrometer screw gauge`, Q(0.01, 'mm'), T`wire diameters, sheet thickness`]])}
<h3>Reading a vernier caliper</h3>
<p>Read the main scale just to the left of the vernier zero, then find the vernier line that lines up exactly with a main-scale line. With 10 vernier divisions, that line number gives tenths of a millimetre.</p>
${Fig(vernierSvg(23.4, T`A vernier caliper reading`), T`Main scale: 23 mm. Vernier line 4 lines up. Reading: $23 + 0.4 = 23.4\,\mathrm{mm}$.`)}
<h3>Reading a micrometer</h3>
<p>The sleeve shows whole and half millimetres; the thimble has 50 divisions of $0.01\,\mathrm{mm}$. Reading = sleeve + thimble $\times\ 0.01\,\mathrm{mm}$. A sleeve showing $5.5\,\mathrm{mm}$ with thimble line 23 gives $5.5 + 0.23 = 5.73\,\mathrm{mm}$.</p>
<h3>Uncertainty</h3>
<p>A single reading is usually quoted with an uncertainty of about half the smallest division, for example $12.5 \pm 0.05\,\mathrm{cm}$ on a millimetre ruler. For several readings of the same quantity, use the <b>mean</b> as the best value and let the spread of the readings show the uncertainty.</p>
${Key(T`<p><b>Significant figures</b> are the digits that carry information about the measurement:</p><ul><li>All non-zero digits count: $4.73$ has 3.</li><li>Zeros between them count: $4.07$ has 3.</li><li>Leading zeros never count: $0.0047$ has 2.</li><li>Trailing zeros after a decimal point count: $4.70$ has 3.</li></ul>`)}
<h3>Calculating with measurements</h3>
<ul><li><b>Multiplying or dividing:</b> give the answer to the <i>fewest significant figures</i> of the values used. $12.5\,\mathrm{cm} \times 3.2\,\mathrm{cm} = 40.0 \to 40\,\mathrm{cm^2}$ (2 s.f.).</li><li><b>Adding or subtracting:</b> give the answer to the <i>fewest decimal places</i>. $12.52 + 3.1 = 15.62 \to 15.6$.</li></ul>

<p>Some quantities are fully described by a size alone: a mass of $5\,\mathrm{kg}$, a temperature of $30^\circ\mathrm{C}$. These are <b>scalars</b>. Others also need a direction: a displacement of $5\,\mathrm{m}$ <i>north</i>, a force of $20\,\mathrm{N}$ <i>downwards</i>. These are <b>vectors</b>.</p>
${Tbl([T`Scalars`, T`Vectors`], [[T`distance, speed`, T`displacement, velocity`], [T`mass, time`, T`acceleration, force`], [T`energy, work, power`, T`momentum, impulse`], [T`temperature, charge`, T`electric field, weight`]])}
<p>A vector is drawn as an arrow. Its length shows the <b>magnitude</b> and the arrowhead shows the <b>direction</b>. In print a vector is written in bold, $\mathbf{F}$, or with an arrow, $\vec{F}$; its magnitude is written $F$ or $|\vec{F}|$.</p>
<h3>Components</h3>
<p>A vector of magnitude $A$ at angle $\theta$ above the positive $x$-axis can be split into two perpendicular parts:</p>
${Fm(T`A_x = A\cos\theta \qquad A_y = A\sin\theta`)}
${Fig(vectorSvg([{ x: 5.2, y: 3, label: 'A' }, { x: 5.2, y: 0, label: sub('A', 'x'), kind: 'c' }, { x: 0, y: 3, label: sub('A', 'y'), kind: 'c', from: [5.2, 0] }], T`A vector A split into a horizontal component and a vertical component`, 7), T`The components $A_x$ and $A_y$ add up to $\vec{A}$.`)}
<h3>Adding vectors</h3>
<p>To add vectors, place them head to tail; the <b>resultant</b> runs from the first tail to the last head.</p>
<ul><li>Same direction: add the magnitudes. $3\,\mathrm{N} + 4\,\mathrm{N}$ to the right gives $7\,\mathrm{N}$ to the right.</li><li>Opposite directions: subtract, and the resultant points the way of the larger one.</li><li>Perpendicular: use Pythagoras. $3\,\mathrm{N}$ east and $4\,\mathrm{N}$ north give $\sqrt{3^2 + 4^2} = 5\,\mathrm{N}$.</li></ul>
${Key(T`<p>For vectors at any angle, add the components:</p><p>$$R_x = A_x + B_x, \qquad R_y = A_y + B_y,$$</p><p>$$R = \sqrt{R_x^2 + R_y^2}, \qquad \tan\varphi = \frac{R_y}{R_x}.$$</p><p>For two vectors $A$ and $B$ with angle $\alpha$ between them, this gives the shortcut $R = \sqrt{A^2 + B^2 + 2AB\cos\alpha}$.</p>`)}

${Tip(T`<p>The angle in $R = \sqrt{A^2 + B^2 + 2AB\cos\alpha}$ is the angle <i>between the two vectors</i> when they start from the same point, not the angle inside the head-to-tail triangle.</p>`)}`,

<h3>Acceleration</h3>
<p><b>Acceleration</b> is the rate of change of velocity. Its unit is $\mathrm{m/s}$ per second, written $\mathrm{m/s^2}$:</p>

<h3>Second law: $F = ma$</h3>

<p>The <b>net force</b> $\Sigma F$ is the vector sum of all forces on the object. A larger net force gives a larger acceleration; a larger mass gives a smaller one. $1\,\mathrm{N}$ is the force that gives $1\,\mathrm{kg}$ an acceleration of $1\,\mathrm{m/s^2}$.</p>
<h3>Third law: action and reaction</h3>
<p>If body A pushes on body B, then B pushes back on A with a force of equal size in the opposite direction. The two forces act on <b>different</b> bodies, so they never cancel each other.</p>
<h3>Common forces</h3>
<ul><li><b>Weight</b> $W = mg$, pulling towards the centre of the Earth.</li><li><b>Normal force</b> $N$, from a surface, perpendicular to it.</li><li><b>Tension</b> $T$, along a rope or string.</li><li><b>Friction</b> $f$, along a surface, against sliding (next topic).</li></ul>

  lesson: () => T`
<p><b>Friction</b> is the force between two surfaces that opposes sliding. It acts along the surface, against the motion (or against the motion that would happen without it).</p>
<h3>Static and kinetic friction</h3>
<ul><li><b>Static friction</b> holds an object still. It grows as you push harder, up to a maximum: $f_{s,\max} = \mu_s N$.</li><li><b>Kinetic friction</b> acts once the object slides: $f_k = \mu_k N$, roughly constant.</li></ul>
<p>$\mu_s$ and $\mu_k$ are the <b>coefficients of friction</b>. They have no unit, and usually $\mu_k \lt \mu_s$, which is why it is harder to start pushing a box than to keep it moving. On a level floor with no other vertical forces, $N = mg$.</p>
${Ex(T`<p>A $20\,\mathrm{kg}$ crate is pushed along a floor with $\mu_k = 0.3$ by a $100\,\mathrm{N}$ horizontal force ($g = 10\,\mathrm{m/s^2}$). Friction: $f = 0.3 \cdot 20 \cdot 10 = 60\,\mathrm{N}$. Net force: $100 - 60 = 40\,\mathrm{N}$, so $a = 40/20 = 2\,\mathrm{m/s^2}$.</p>`)}
<h3>Inclined planes</h3>
${Fig(inclineSvg(30, T`A block on a slope inclined at angle theta, with its weight, the normal force and friction`, true), T`On a slope the weight $mg$ is split into two components.`)}

<p>A block at rest stays put as long as $mg\sin\theta \le \mu_s mg\cos\theta$, that is, while $\tan\theta \le \mu_s$.</p>

<p><b>Energy</b> is the ability to do work, and <b>work</b> is energy transferred by a force. Both are measured in joules ($\mathrm{J}$).</p>
<h3>Work</h3>
${Fm(T`W = F\,s\cos\theta`)}
<p>Here $F$ is the force, $s$ the displacement and $\theta$ the angle between them. Only the part of the force along the motion does work. A force perpendicular to the motion (like the normal force on a level floor) does no work; a force against the motion (like friction) does negative work.</p>
<h3>Kinetic and potential energy</h3>
${Fm(T`E_k = \tfrac12 m v^2 \qquad E_p = m g h`)}
<p>Kinetic energy belongs to motion; gravitational potential energy to height above a chosen reference level.</p>
${Key(T`<p><b>Work–energy theorem:</b> the net work on an object equals its change in kinetic energy, $W_{\text{net}} = \Delta E_k$.</p><p><b>Conservation of mechanical energy:</b> if only gravity does work (no friction),</p><p>$$E_k + E_p = \text{constant}, \qquad \tfrac12 m v_1^2 + m g h_1 = \tfrac12 m v_2^2 + m g h_2.$$</p>`)}
${Ex(T`<p>A roller-coaster car starts from rest $20\,\mathrm{m}$ above the bottom of a smooth track ($g = 10\,\mathrm{m/s^2}$). At the bottom all the potential energy has become kinetic:</p><p>$$mgh = \tfrac12 m v^2 \;\Rightarrow\; v = \sqrt{2gh} = \sqrt{400} = 20\,\mathrm{m/s}.$$</p><p>The mass cancels, so every car reaches the same speed.</p>`)}
<h3>Power and efficiency</h3>
${Fm(T`P = \frac{W}{t} = F v \qquad \eta = \frac{\text{useful output}}{\text{input}} \times 100\%`)}
<p>Power is measured in watts: $1\,\mathrm{W} = 1\,\mathrm{J/s}$.</p>

  blurb: 'Momentum and impulse, conservation of momentum, collisions that stick together, recoil and elastic collisions.',
  lesson: () => T`
<p>The <b>momentum</b> of an object is its mass times its velocity. It is a vector, pointing the same way as the velocity, and its unit is $\mathrm{kg\,m/s}$.</p>
${Fm(T`p = m v`)}
<h3>Impulse</h3>
<p>A force acting for a time changes the momentum. The product $F\,\Delta t$ is the <b>impulse</b>:</p>
${Fm(T`J = F\,\Delta t = \Delta p = m v - m v_0`)}
<p>This is why airbags and crumple zones save lives: spreading the same change of momentum over a longer time means a smaller force.</p>
${Key(T`<p><b>Conservation of momentum:</b> when no outside force acts on a system, its total momentum stays the same. For two objects colliding:</p><p>$$m_1 v_1 + m_2 v_2 = m_1 v_1' + m_2 v_2'.$$</p><p>Choose a positive direction and give velocities the other way a minus sign.</p>`)}
<h3>Types of collision</h3>
<ul><li><b>Perfectly inelastic:</b> the objects stick together and move off with one common velocity $v' = \dfrac{m_1 v_1 + m_2 v_2}{m_1 + m_2}$. Kinetic energy is lost (to heat, sound, deformation).</li><li><b>Elastic:</b> kinetic energy is conserved as well. When two equal masses collide elastically head-on, they swap velocities.</li><li>Most real collisions are in between: momentum is conserved, some kinetic energy is lost.</li></ul>
${Ex(T`<p>A $2\,\mathrm{kg}$ cart at $6\,\mathrm{m/s}$ hits a $1\,\mathrm{kg}$ cart at rest and they stick. $v' = \frac{2 \cdot 6 + 1 \cdot 0}{3} = 4\,\mathrm{m/s}$. Kinetic energy before: $36\,\mathrm{J}$; after: $\tfrac12 \cdot 3 \cdot 4^2 = 24\,\mathrm{J}$, so $12\,\mathrm{J}$ is lost.</p>`)}
<h3>Recoil</h3>
<p>Before a gun fires, the total momentum is zero, so afterwards the bullet's forward momentum is balanced by the gun's backward momentum: $m_b v_b = m_g v_g$.</p>
${Tip(T`<p>When a ball bounces back, its velocity changes sign. Bouncing from $+5\,\mathrm{m/s}$ to $-5\,\mathrm{m/s}$ is a change of $10\,\mathrm{m/s}$, not zero.</p>`)}`,

  lesson: () => T`
<p>Forces make things speed up in a straight line; <b>torques</b> make them spin faster or slower.</p>
<h3>Torque</h3>
${Fm(T`\tau = r F \sin\theta`)}
<p>$r$ is the distance from the axis to where the force acts and $\theta$ the angle between $r$ and $F$. The unit is $\mathrm{N\,m}$. A force pointing straight at the axis ($\theta = 0$) produces no torque, which is why door handles are far from the hinges.</p>
<h3>Moment of inertia</h3>
<p>The rotational version of mass is the <b>moment of inertia</b> $I = \sum m r^2$. Mass far from the axis counts much more than mass close to it.</p>
${Tbl([T`Object (axis through centre unless stated)`, '$I$'], [[T`Thin ring or hoop`, '$MR^2$'], [T`Solid disc or cylinder`, '$\\tfrac12 MR^2$'], [T`Solid sphere`, '$\\tfrac25 MR^2$'], [T`Thin rod, about its centre`, '$\\tfrac1{12} ML^2$'], [T`Thin rod, about one end`, '$\\tfrac13 ML^2$']])}

<p>A rigid body is in <b>equilibrium</b> when it neither speeds up nor starts to turn. That needs two conditions at once.</p>
${Key(T`<p><b>Conditions for equilibrium</b></p><ol><li>The net force is zero: $\Sigma F_x = 0$ and $\Sigma F_y = 0$.</li><li>The net torque (moment) about <i>any</i> point is zero: clockwise moments = anticlockwise moments.</li></ol>`)}
<p>The <b>moment</b> of a force about a point is the force times its perpendicular distance from that point. Choosing the point where an unknown force acts removes that force from the moment equation, which makes problems much shorter.</p>
<h3>Levers and seesaws</h3>
${Fig(beamSvg(4, [{ x: 2, kind: 'pivot' }, { x: 0.5, kind: 'load', label: '300 N' }, { x: 3.5, kind: 'load', label: '300 N' }], T`A seesaw balanced on a central pivot with equal loads at equal distances`), T`Equal moments about the pivot: $300 \times 1.5 = 300 \times 1.5$.`)}
<p>A seesaw balances when $F_1 d_1 = F_2 d_2$. A lever lets a small effort lift a large load when the effort is much farther from the pivot than the load.</p>
${Ex(T`<p>A uniform $4\,\mathrm{m}$ plank of weight $200\,\mathrm{N}$ rests on supports at its two ends. A $600\,\mathrm{N}$ person stands $1\,\mathrm{m}$ from the left end. Taking moments about the left support: $R_B \cdot 4 = 600 \cdot 1 + 200 \cdot 2$, so $R_B = 250\,\mathrm{N}$. Then $R_A = 800 - 250 = 550\,\mathrm{N}$.</p>`)}
<h3>Centre of gravity and stability</h3>
<p>The weight of a body acts as if at one point, its <b>centre of gravity</b>; for a uniform beam that is the middle. An object resting on a base topples when the vertical line through its centre of gravity falls outside the base. A low centre of gravity and a wide base make an object more stable.</p>

<h3>The gravitational field strength $g$</h3>

<h3>Escape speed</h3>
<p>The speed needed to leave a planet's surface for good (ignoring air) is $v_{\text{esc}} = \sqrt{\dfrac{2GM}{R}}$, about $11.2\,\mathrm{km/s}$ for the Earth.</p>

  id: 'elasticity', stage: 'sh', title: 'Elasticity & Springs',
  blurb: 'Hooke’s law, springs in series and parallel, stress, strain, Young’s modulus and elastic potential energy.',
  lesson: () => T`
<p>An <b>elastic</b> material returns to its original shape when the force is removed. Springs, rubber bands, and steel wires (for small stretches) all behave this way.</p>
<h3>Hooke's law</h3>
${Fm(T`F = k\,x`)}
<p>The extension $x$ is proportional to the force $F$, up to the <b>elastic limit</b>. The spring constant $k$ (in $\mathrm{N/m}$) measures stiffness: a stiff spring has a large $k$.</p>
<h3>Combining springs</h3>
<ul><li><b>Parallel</b> (side by side, sharing the load): $k = k_1 + k_2$. Stiffer.</li><li><b>Series</b> (one below the other): $\dfrac{1}{k} = \dfrac{1}{k_1} + \dfrac{1}{k_2}$. Softer.</li></ul>
<h3>Stress, strain and Young's modulus</h3>
${Fm(T`\sigma = \frac{F}{A} \qquad \varepsilon = \frac{\Delta L}{L} \qquad E = \frac{\sigma}{\varepsilon} = \frac{F L}{A\,\Delta L}`)}
<p>Stress $\sigma$ is force per area (in $\mathrm{Pa}$); strain $\varepsilon$ is the fractional change in length (no unit). The <b>Young's modulus</b> $E$ is a property of the material, not of the particular wire: steel has about $2 \times 10^{11}\,\mathrm{Pa}$.</p>
${Key(T`<p>A stretched or compressed spring stores <b>elastic potential energy</b>:</p><p>$$E_p = \tfrac12 k x^2 = \tfrac12 F x.$$</p><p>It is the area under the force–extension graph, a triangle.</p>`)}
${Tip(T`<p>Extension is the <i>change</i> in length, not the new length. A $20\,\mathrm{cm}$ spring stretched to $25\,\mathrm{cm}$ has $x = 5\,\mathrm{cm} = 0.05\,\mathrm{m}$.</p>`)}`,

<h3>Pressure in a liquid</h3>

<p>The pressure at depth $h$ is the pressure at the surface $p_0$ (atmospheric pressure, about $1.0 \times 10^{5}\,\mathrm{Pa}$) plus the weight of the liquid above each square metre, $\rho g h$. It depends only on depth, not on the shape of the container, and acts equally in all directions.</p>
<h3>Pascal's principle and hydraulics</h3>
<p>Pressure applied to an enclosed liquid is passed on undiminished to every part of it. In a hydraulic press or car lift the pressure is the same under both pistons, so</p>

<p>For an ideal fluid (incompressible, no friction, steady flow) two simple laws describe the motion.</p>
<h3>Flow rate and continuity</h3>
${Fm(T`Q = \frac{V}{t} = A\,v \qquad A_1 v_1 = A_2 v_2`)}
<p>The volume flow rate $Q$ (in $\mathrm{m^3/s}$) is the same all along a pipe, because the fluid cannot pile up anywhere. Where the pipe narrows, the fluid speeds up. Putting your thumb over a garden hose makes the water squirt faster for this reason.</p>
${Key(T`<p><b>Bernoulli's equation</b> (conservation of energy for a flowing fluid):</p><p>$$p + \tfrac12 \rho v^2 + \rho g h = \text{constant along a streamline}.$$</p><p>In a horizontal pipe, where the fluid flows faster its pressure is lower.</p>`)}
<h3>Torricelli's law</h3>
<p>Water leaking from a hole a depth $h$ below the surface of an open tank comes out at the speed of a free fall from that height:</p>
${Fm(T`v = \sqrt{2 g h}`)}
<h3>Applications</h3>
<ul><li>An aircraft wing makes air flow faster over its top surface, so the pressure above is lower than below: lift.</li><li>A Venturi meter measures flow speed from the pressure drop in a narrow section.</li><li>Two sheets of paper held close together are pushed towards each other when you blow between them.</li></ul>

<h3>Centre of mass</h3>
<p>For a set of point masses, the <b>centre of mass</b> is the mass-weighted average position:</p>

<p>The centre of mass of a system moves as if all the mass were concentrated there and all the external forces acted on it: $\Sigma F_{\text{ext}} = M a_{\text{cm}}$. When a shell explodes in mid-air, its fragments fly apart, but their centre of mass keeps following the original parabola.</p>
<h3>Angular momentum</h3>
${Fm(T`L = I\,\omega \qquad \text{(for a point mass: } L = m v r\text{)}`)}
<p>Angular momentum is the rotational counterpart of momentum. A net torque changes it: $\tau = \dfrac{\Delta L}{\Delta t}$.</p>
${Key(T`<p><b>Conservation of angular momentum:</b> if no external torque acts, $L$ stays constant:</p><p>$$I_1 \omega_1 = I_2 \omega_2.$$</p><p>A figure skater who pulls in her arms reduces $I$, so $\omega$ goes up and she spins faster.</p>`)}

<p>An echo travels to a reflecting surface and back, so the distance to the surface is $d = \dfrac{v t}{2}$. Bats, ships' sonar and ultrasound scanners all use this.</p>

<p><b>Temperature</b> tells us how hot something is; it measures the average kinetic energy of its particles. <b>Heat</b> is energy that flows from a hotter object to a colder one because of the temperature difference. Heat is measured in joules.</p>
<h3>Temperature scales</h3>
${Fm(T`T_K = T_C + 273 \qquad T_F = \tfrac95 T_C + 32`)}
<p>A change of $1^\circ\mathrm{C}$ is the same as a change of $1\,\mathrm{K}$. Water freezes at $0^\circ\mathrm{C} = 273\,\mathrm{K} = 32^\circ\mathrm{F}$ and boils at $100^\circ\mathrm{C} = 373\,\mathrm{K} = 212^\circ\mathrm{F}$. (More precisely, $0^\circ\mathrm{C} = 273.15\,\mathrm{K}$.)</p>
<h3>Specific heat capacity</h3>
<p>The heat needed to change the temperature of a mass $m$ by $\Delta T$ is</p>
${Fm(T`Q = m\,c\,\Delta T`)}
<p>where $c$ is the <b>specific heat capacity</b> of the material, in $\mathrm{J/(kg\,{}^\circ C)}$: the heat needed to warm $1\,\mathrm{kg}$ by $1^\circ\mathrm{C}$. Water has a very large value, about $4200\,\mathrm{J/(kg\,{}^\circ C)}$, which is why the sea warms and cools slowly.</p>
<h3>Changes of state</h3>
<p>While a substance melts or boils, its temperature stays constant even though heat is flowing in. The heat needed is</p>
${Fm(T`Q = m\,L`)}
<p>where $L$ is the <b>latent heat</b>: about $3.34 \times 10^{5}\,\mathrm{J/kg}$ to melt ice and $2.26 \times 10^{6}\,\mathrm{J/kg}$ to boil water.</p>
${Key(T`<p><b>Calorimetry (Black's principle):</b> when hot and cold objects are mixed in an insulated container, the heat lost by the hot one equals the heat gained by the cold one:</p><p>$$m_1 c_1 (T_1 - T) = m_2 c_2 (T - T_2),$$</p><p>where $T$ is the final common temperature.</p>`)}

<p>Most materials expand when heated. A rod of length $L_0$ grows by</p>

<p>A gas is made of a huge number of molecules moving randomly and colliding with each other and the walls of their container. The collisions with the walls cause the gas <b>pressure</b>.</p>
<h3>The gas laws</h3>
<ul><li><b>Boyle's law</b> (constant temperature): $p_1 V_1 = p_2 V_2$. Squeeze a gas into half the volume and its pressure doubles.</li><li><b>Charles's law</b> (constant pressure): $\dfrac{V_1}{T_1} = \dfrac{V_2}{T_2}$.</li><li><b>Gay-Lussac's law</b> (constant volume): $\dfrac{p_1}{T_1} = \dfrac{p_2}{T_2}$.</li></ul>
${Key(T`<p>All three combine into the <b>ideal gas equation</b>:</p><p>$$pV = nRT, \qquad R = 8.31\,\mathrm{J/(mol\,K)},$$</p><p>where $n$ is the number of moles and $T$ the <b>absolute temperature in kelvin</b>. For a fixed amount of gas, $\dfrac{p_1 V_1}{T_1} = \dfrac{p_2 V_2}{T_2}$.</p>`)}
<h3>Kinetic theory</h3>
<p>The temperature of a gas measures the average kinetic energy of its molecules:</p>

<p>The typical (root-mean-square) speed of molecules of molar mass $M$ (in $\mathrm{kg/mol}$) is $v_{\text{rms}} = \sqrt{\dfrac{3RT}{M}}$: lighter molecules move faster at the same temperature.</p>
${Tip(T`<p>Always use kelvin in the gas laws. Doubling the temperature from $20^\circ\mathrm{C}$ to $40^\circ\mathrm{C}$ does <i>not</i> double the absolute temperature: $293\,\mathrm{K} \to 313\,\mathrm{K}$.</p>`)}`,

<h3>The first law</h3>
<p>The <b>internal energy</b> $U$ of a gas is the total kinetic energy of its molecules (for an ideal gas it depends only on temperature). It changes when heat flows in or when the gas does work:</p>
${Fm(T`\Delta U = Q - W`)}
<p>$Q$ is the heat added <i>to</i> the gas and $W$ the work done <i>by</i> the gas. This is conservation of energy.</p>
<h3>Work done by a gas</h3>
<p>A gas expanding at constant pressure $p$ from $V_1$ to $V_2$ does work $W = p\,\Delta V$. On a $p$–$V$ diagram, the work is the area under the curve.</p>
${Tbl([T`Process`, T`What stays fixed`, T`Consequence`], [[T`Isobaric`, T`pressure`, '$W = p\\Delta V$'], [T`Isochoric`, T`volume`, '$W = 0$, $\\Delta U = Q$'], [T`Isothermal`, T`temperature`, '$\\Delta U = 0$, $Q = W$'], [T`Adiabatic`, T`no heat flow`, '$Q = 0$, $\\Delta U = -W$']])}
${Key(T`<p>A <b>heat engine</b> takes in heat $Q_H$ from a hot source, does work $W$ and rejects heat $Q_C$ to a cold sink: $W = Q_H - Q_C$. Its efficiency is</p><p>$$\eta = \frac{W}{Q_H} = 1 - \frac{Q_C}{Q_H}.$$</p><p>No engine working between absolute temperatures $T_H$ and $T_C$ can beat the <b>Carnot efficiency</b> $\eta_{\max} = 1 - \dfrac{T_C}{T_H}$.</p>`)}
<h3>The second law and refrigerators</h3>
<p>Heat flows by itself only from hot to cold, and no engine can turn all of its heat into work. A refrigerator uses work $W$ to move heat $Q_C$ out of its cold interior; its coefficient of performance is $\mathrm{COP} = \dfrac{Q_C}{W}$.</p>
${Tip(T`<p>Watch the signs: heat <i>removed</i> from the gas makes $Q$ negative, and work done <i>on</i> the gas (compression) makes $W$ negative.</p>`)}`,

<h3>Convection</h3>

${Fig(circuitSvg('parallel', ['R₁', 'R₂', 'R₃'], 'ε', circLabel()), T`Three resistors in parallel: the current splits between the branches.`)}

    ${it.type === 'mc' ? `<ol class="sample-choices">${it.choices.map((c, j) => `<li><span class="letter" aria-hidden="true">${LETTERS[j]}</span><span>${c}</span></li>`).join('')}</ol>` : ''}
    <div class="sample-actions"><button type="button" class="btn btn-small" data-act="sample-new">${ICON.refresh}${esc(ui('anotherQ'))}</button><button type="button" class="btn btn-small btn-ghost" data-act="sample-reveal" aria-expanded="false" aria-controls="sample-ans">${esc(ui('showAnswer'))}</button></div>
    <div class="sample-ans reveal collapsed" id="sample-ans"><p class="sample-answer"><b>${esc(ui('answerColon'))}</b> ${it.type === 'mc' ? `${LETTERS[it.correct]} — ${it.choices[it.correct]}` : it.ansHTML}</p><p class="sample-sol">${it.s}</p></div>`);
}

/* ---------------- topic pages ---------------- */
function renderTopic(t, tab) {
  const lv = t.level, pos = t.review ? ui('mixedReview') : t.code + (t.stage ? ' · ' + ui('stage_' + t.stage) : '');
  document.title = `${tTitle(t)} · Physics Ladder`;
  main.innerHTML = `
  <article class="topic" style="--lv: var(--${lv.color})">
    <header class="topic-head">
      <nav class="crumbs" aria-label="${esc(ui('breadcrumb'))}"><a href="#">${esc(ui('home'))}</a><span aria-hidden="true">/</span><span>${esc(lvName(lv))}</span></nav>
      <p class="eyebrow"><span class="rung" aria-hidden="true">${lv.mark}</span>${esc(lvName(lv))} · ${esc(pos)}</p>
      <h1>${esc(tTitle(t))}</h1>
      <p class="lede">${esc(tBlurb(t))}</p>
      ${t.review ? '' : `<nav class="topic-tabs" aria-label="${esc(ui('topicSections'))}"><a href="#${t.id}"${tab === 'lesson' ? ' aria-current="page"' : ''}>${esc(ui('lesson'))}</a><a href="#${t.id}.practice"${tab === 'practice' ? ' aria-current="page"' : ''}>${esc(ui('practice'))}</a></nav>`}
    </header>
    <div id="panel"></div>
  </article>`;
  if (tab === 'practice') renderPractice(t); else renderLesson(t);
}
function renderLesson(t) {
  const i = ALL.indexOf(t), prev = ALL[i - 1], next = ALL[i + 1];
  const body = typeof t.lesson === 'function' ? t.lesson() : t.lesson;
  setHTML($('#panel'), `
    <div class="lesson-tools no-print"><button type="button" class="btn btn-small btn-ghost" data-act="print-lesson">${ICON.print}${esc(ui('printLesson'))}</button></div>
    ${ladderLinks(t)}
    <div class="prose">${body}</div>
    ${sourceLine()}
    <div class="lesson-foot no-print">
      <a class="btn btn-primary" href="#${t.id}.practice">${esc(ui('practiseTopic', tTitle(t)))}</a>
      <nav class="pager" aria-label="${esc(ui('otherTopics'))}">
        ${prev ? `<a href="#${prev.id}"><small>${esc(ui('prev'))}</small>${esc(tTitle(prev))}</a>` : '<span></span>'}
        ${next ? `<a href="#${next.id}" class="pager-next"><small>${esc(ui('next'))}</small>${esc(tTitle(next))}</a>` : '<span></span>'}
      </nav>
    </div>`);
}
/* prerequisites and next topics, each with the one-sentence reason for the link */
function ladderLinks(t) {
  const item = (o, e) => {
    const head = o.math
      ? `<a href="https://rendyhn.github.io/math-ladder/?lang=${I18N.lang}#${o.math}" target="_blank" rel="noopener" class="rungs-math"><span class="rung" aria-hidden="true">∑</span><span>${esc(mathTitle(o.math))}</span><small>${esc(ui('mathLadder'))} ↗</small></a>`
      : o.soon
        ? `<span class="rungs-soon" style="--lv: var(--${o.level.color})"><span class="rung" aria-hidden="true">${o.code}</span><span>${esc(tTitle(o))}</span><small>${esc(ui('soon'))}</small></span>`
        : `<a href="#${o.id}" style="--lv: var(--${o.level.color})"><span class="rung" aria-hidden="true">${o.code}</span><span>${esc(tTitle(o))}</span></a>`;
    return `<li>${head}<p>${e.why()}</p></li>`;
  };
  const col = (key, list, pick, empty) => `<div class="rungs-col"><h2 class="kicker">${esc(ui(key))}</h2>${list && list.length
    ? `<ul>${list.map(e => item(linkEnd(pick(e)), e)).join('')}</ul>` : `<p class="rungs-empty">${esc(ui(empty))}</p>`}</div>`;
  return `<details class="rungs no-print"${store.get('ladderOpen', true) ? ' open' : ''}><summary>${ICON.chev}${esc(ui('ladderHead'))}</summary>
    <div class="rungs-cols">${col('buildsOn', t.needs, e => e.from, 'ladderStart')}${col('leadsTo', t.opens, e => e.to, 'ladderTop')}</div></details>`;
}
function getSheet(t, fresh) {
  let sh = sheets.get(t.id);
  if (!sh || fresh || sh.n !== settings.n || sh.mode !== settings.mode) { sh = makeSheet(t, settings.n, settings.mode, newSeed()); sheets.set(t.id, sh); }
  return sh;
}
function renderPractice(t, fresh = false) {
  const sh = getSheet(t, fresh), lv = t.level, id = sheetId(sh.seed);
  const qs = sh.items.map((it, i) => {
    const base = `q${sh.seed}-${i}`, ans = sh.answers[i];
    const body = it.type === 'mc'
      ? `<div class="choices" role="radiogroup" aria-label="${esc(ui('choicesFor', i + 1))}">${it.choices.map((c, j) => `<label class="choice${ans === j ? ' sel' : ''}" for="${base}-${j}"><input type="radio" id="${base}-${j}" name="${base}" value="${j}" data-i="${i}"${ans === j ? ' checked' : ''}><span class="letter" aria-hidden="true">${LETTERS[j]}</span><span class="choice-body">${c}</span></label>`).join('')}</div>`
      : `<div class="fill"><label class="fill-label" for="${base}-in">${esc(ui('answer'))}</label><input type="text" dir="ltr" id="${base}-in" data-i="${i}" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="text" placeholder="${esc(ui('typeAnswer'))}" value="${esc(ans || '')}">${it.u ? `<span class="fill-unit">${esc(it.u)}</span>` : ''}</div>${it.h ? `<p class="fill-hint no-print">${esc(it.h)}</p>` : ''}`;
    return `<li class="q" data-i="${i}"><div class="q-meta"><span class="q-num">${i + 1}</span><span class="q-type">${esc(ui(it.type === 'mc' ? 'qMc' : 'qFill'))}</span>${t.review ? `<span class="q-topic">${esc(tTitle(TOPICS.get(it.topic)))}</span>` : ''}</div><div class="q-text">${it.q}</div>${body}<p class="feedback" aria-live="polite"></p></li>`;
  }).join('');
  const key = sh.items.map((it, i) => `<li><div class="key-row"><span class="q-num">${i + 1}</span><div class="key-ans">${it.type === 'mc' ? `<span class="key-letter">${LETTERS[it.correct]}</span>${it.choices[it.correct]}` : it.ansHTML}</div></div>${it.s ? `<div class="key-sol">${it.s}</div>` : ''}</li>`).join('');
  setHTML($('#panel'), `
    <div class="ws-controls no-print">
      <div class="ctrl"><span class="ctrl-label" id="cnt-label">${esc(ui('questions'))}</span><div class="seg" role="group" aria-labelledby="cnt-label">${[5, 10, 15, 20].map(n => `<button type="button" class="seg-btn" data-n="${n}" aria-pressed="${settings.n === n}">${n}</button>`).join('')}</div></div>
      <div class="ctrl"><label class="ctrl-label" for="mode-select">${esc(ui('qType'))}</label><select id="mode-select">${Object.entries(MODE_KEYS).map(([k, v]) => `<option value="${k}"${settings.mode === k ? ' selected' : ''}>${esc(ui(v))}</option>`).join('')}</select></div>
      <div class="ctrl-actions"><button type="button" class="btn btn-primary" data-act="new">${ICON.refresh}${esc(ui('newSheet'))}</button><button type="button" class="btn" data-act="print-q">${ICON.print}${esc(ui('printQ'))}</button></div>
    </div>
    <section class="sheet" aria-label="${esc(ui('worksheet'))}">
      <header class="sheet-head">
        <div class="sheet-title"><p class="kicker">${esc(ui('practiceSheet', lvName(lv)))}</p><h2>${esc(tTitle(t))}</h2></div>
        <dl class="sheet-meta"><div><dt>${esc(ui('sheet'))}</dt><dd>#${id}</dd></div><div><dt>${esc(ui('questions'))}</dt><dd>${sh.items.length}</dd></div><div><dt>${esc(ui('type'))}</dt><dd>${esc(ui(MODE_KEYS[sh.mode]))}</dd></div></dl>
        <div class="print-only name-line"><span>${esc(ui('name'))} ____________________________</span><span>${esc(ui('klass'))} ________</span><span>${esc(ui('date'))} ______________</span><span>${esc(ui('score'))} ______ / ${sh.items.length}</span></div>
        ${sourceLine()}
      </header>
      <p class="sheet-note no-print">${ui('fillNote')}</p>
      <ol class="qs">${qs}</ol>
      <div class="check-bar no-print"><button type="button" class="btn btn-primary" data-act="check">${ICON.check}${esc(ui('checkAnswers'))}</button><button type="button" class="btn btn-ghost" data-act="clear">${esc(ui('clearAnswers'))}</button><p class="score" role="status"></p></div>
    </section>
    <section class="key-sec" aria-label="${esc(ui('answerKey'))}">
      <div class="key-head no-print">
        <button type="button" class="key-toggle" data-act="toggle-key" aria-expanded="${sh.keyOpen}" aria-controls="key-body">${ICON.chev}<span>${esc(ui(sh.keyOpen ? 'hideKey' : 'showKey'))}</span></button>
        <div class="key-actions"><button type="button" class="btn btn-small" data-act="print-key">${ICON.print}${esc(ui('printKey'))}</button><button type="button" class="btn btn-small" data-act="print-both">${ICON.print}${esc(ui('printBoth'))}</button></div>
      </div>
      <div class="key-body reveal${sh.keyOpen ? '' : ' collapsed'}" id="key-body">
        <header class="print-only key-print-head"><p class="kicker">${esc(ui('keyHead', lvName(lv)))}</p><h2>${esc(tTitle(t))}</h2><p>${esc(ui('sheetNo', id))}</p>${sourceLine()}</header>
        <ol class="key-list">${key}</ol>
      </div>
    </section>`);
  if (sh.checked) checkSheet(false);
}

/* ---------------- checking ---------------- */
function currentSheet() { return current.view === 'topic' ? sheets.get(current.id) : null; }
function checkSheet(announce = true) {
  const sh = currentSheet(); if (!sh) return;
  let right = 0, blank = 0;
  const fbs = [];
  sh.items.forEach((it, i) => {
    const li = main.querySelector(`.q[data-i="${i}"]`); if (!li) return;
    const fb = li.querySelector('.feedback'); li.classList.remove('is-right', 'is-wrong', 'is-blank');
    let res;
    if (it.type === 'mc') {
      const a = sh.answers[i]; res = a == null ? null : a === it.correct;
      li.querySelectorAll('.choice').forEach((c, j) => { c.classList.toggle('is-answer', j === it.correct); c.classList.toggle('is-miss', j === a && a !== it.correct); });
    } else res = checkFill(it.check, sh.answers[i]);
    const correctTxt = it.type === 'mc' ? `${LETTERS[it.correct]} — ${it.choices[it.correct]}` : it.ansHTML;
    if (res === null) { blank++; li.classList.add('is-blank'); fb.innerHTML = `<span class="fb-tag">${esc(ui('notAnswered'))}</span> ${esc(ui('answerColon'))} ${correctTxt}`; }
    else if (res) { right++; li.classList.add('is-right'); fb.innerHTML = `<span class="fb-tag">${esc(ui('correct'))}</span>`; }
    else { li.classList.add('is-wrong'); fb.innerHTML = `<span class="fb-tag">${esc(ui('notQuite'))}</span> ${esc(ui('answerColon'))} ${correctTxt}`; }
    if (mjState === 'failed') fb.innerHTML = fallbackStr(fb.innerHTML);
    fbs.push(fb);
  });
  sh.checked = true;
  const score = main.querySelector('.score');
  if (score) score.innerHTML = `<b>${esc(ui('scoreLine', right, sh.items.length))}</b>${blank ? ` · ${esc(ui('unanswered', blank))}` : ''}`;
  fbs.forEach(typeset);
  if (announce) { const first = main.querySelector('.q.is-wrong, .q.is-blank'); if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
}

/* ---------------- printing ---------------- */
function toast(msg) { toastEl.textContent = msg; toastEl.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { toastEl.hidden = true; }, 8000); }
function doPrint(kind) {
  document.body.dataset.print = kind;
  let framed = false; try { framed = window.self !== window.top; } catch (e) { framed = true; }
  if (framed) toast(ui('printToast'));
  mjChain.then(() => setTimeout(() => { try { window.print(); } catch (e) { /* blocked */ } }, 80));
}
window.addEventListener('afterprint', () => { delete document.body.dataset.print; });

/* ---------------- languages ---------------- */
const LANG_FONTS = { zh: 'Noto+Sans+SC', ja: 'Noto+Sans+JP', ko: 'Noto+Sans+KR', ar: 'Noto+Sans+Arabic', fa: 'Vazirmatn', ru: 'Noto+Sans' };
const HTML_LANG = { zh: 'zh-Hans' };
const packLoads = {};
function loadPack(code) {
  if (code === 'en' || I18N_PACKS[code]) return Promise.resolve(true);
  if (!packLoads[code]) packLoads[code] = new Promise(res => {
    const s = document.createElement('script');
    s.src = `lang/${code}.js`; s.async = true;
    s.onload = () => res(!!I18N_PACKS[code]); s.onerror = () => { delete packLoads[code]; res(false); };
    document.head.appendChild(s);
  });
  return packLoads[code];
}
function applyChrome() {
  const code = I18N.lang, root = document.documentElement;
  root.lang = HTML_LANG[code] || code; root.dir = I18N.conf.dir;
  if (LANG_FONTS[code]) {
    let l = $('#lang-font'); if (!l) { l = document.createElement('link'); l.id = 'lang-font'; l.rel = 'stylesheet'; document.head.appendChild(l); }
    const href = `https://fonts.googleapis.com/css2?family=${LANG_FONTS[code]}:wght@400;700;800&display=swap`;
    if (l.href !== href) l.href = href;
  }
  $('#menu-btn').setAttribute('aria-label', ui('showTopics'));
  $('#brand-tag').textContent = ui('brandTag');
  $('label[for="topic-search"]').textContent = ui('searchLabel');
  $('#lang-label').textContent = ui('language');
  updateThemeBtn();
  $('#lang-code').textContent = code.toUpperCase();
  langSel.value = code;
  updatePrintStyle();
}
async function changeLang(code, persist = true) {
  const ok = await loadPack(code);
  if (!ok) { toast(ui('langFail')); code = 'en'; }
  setLang(code);
  if (persist) store.set('lang', code);
  applyChrome();
  sheets.forEach((sh, id) => {   // same seed -> same numbers, now worded in the new language
    const fresh = makeSheet(TOPICS.get(id), sh.n, sh.mode, sh.seed);
    fresh.answers = sh.answers; fresh.checked = sh.checked; fresh.keyOpen = sh.keyOpen;
    sheets.set(id, fresh);
  });
  renderNav();
  if (current.view === 'home' && $('#sample')) { route(true); renderSample(false); } else route(true);
}
langSel.innerHTML = LANGS.map(([c, n]) => `<option value="${c}" lang="${HTML_LANG[c] || c}">${n}</option>`).join('');
langSel.addEventListener('change', () => changeLang(langSel.value));
function initialLang() {
  const codes = LANGS.map(l => l[0]);
  let q = null; try { q = new URLSearchParams(location.search).get('lang'); } catch (e) { /* no query */ }
  if (q && codes.includes(q)) return q;
  const saved = store.get('lang', null); if (saved && codes.includes(saved)) return saved;
  for (const l of navigator.languages || [navigator.language || 'en']) {
    const base = String(l).toLowerCase().split('-')[0].replace(/^in$/, 'id');
    if (codes.includes(base)) return base;
  }
  return 'en';
}

/* ---------------- events ---------------- */
main.addEventListener('toggle', e => { if (e.target.classList && e.target.classList.contains('rungs')) store.set('ladderOpen', e.target.open); }, true);
main.addEventListener('click', e => {
  const btn = e.target.closest('[data-act], .seg-btn'); if (!btn) return;
  const t = current.view === 'topic' ? TOPICS.get(current.id) : null;
  if (btn.classList.contains('seg-btn')) { settings.n = +btn.dataset.n; store.set('n', settings.n); renderPractice(t, true); return; }
  switch (btn.dataset.act) {
    case 'new': renderPractice(t, true); break;
    case 'check': checkSheet(true); break;
    case 'clear': { const sh = currentSheet(); sh.answers = {}; sh.checked = false; renderPractice(t); break; }
    case 'toggle-key': {
      const sh = currentSheet(); sh.keyOpen = !sh.keyOpen;
      $('#key-body').classList.toggle('collapsed', !sh.keyOpen);
      btn.setAttribute('aria-expanded', String(sh.keyOpen));
      btn.querySelector('span').textContent = ui(sh.keyOpen ? 'hideKey' : 'showKey');
      if (sh.keyOpen) $('#key-body').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      break;
    }
    case 'print-q': doPrint('questions'); break;
    case 'print-key': doPrint('key'); break;
    case 'print-both': doPrint('both'); break;
    case 'print-lesson': doPrint('lesson'); break;
    case 'sample-new': renderSample(); break;
    case 'sample-reveal': { const open = btn.getAttribute('aria-expanded') !== 'true'; btn.setAttribute('aria-expanded', String(open)); btn.textContent = ui(open ? 'hideAnswer' : 'showAnswer'); $('#sample-ans').classList.toggle('collapsed', !open); break; }
  }
});
main.addEventListener('change', e => {
  const el = e.target, t = current.view === 'topic' ? TOPICS.get(current.id) : null;
  if (el.id === 'mode-select') { settings.mode = el.value; store.set('mode', settings.mode); renderPractice(t, true); return; }
  if (el.type === 'radio') {
    const sh = currentSheet(), i = +el.dataset.i; sh.answers[i] = +el.value;
    el.closest('.choices').querySelectorAll('.choice').forEach(c => c.classList.toggle('sel', c.contains(el)));
  }
});
main.addEventListener('input', e => { const el = e.target; if (el.matches('.fill input')) { const sh = currentSheet(); sh.answers[+el.dataset.i] = el.value; } });
main.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('.fill input')) { const all = [...main.querySelectorAll('.q input[type="text"]')], k = all.indexOf(e.target); if (all[k + 1]) all[k + 1].focus(); } });

/* ---------------- boot ---------------- */
window.__mathLadder = { finalize, checkFill, canFill, TOPICS, changeLang, UI_EN };   // hook for self-tests
const startLang = initialLang();
if (startLang === 'en') { setLang('en'); applyChrome(); renderNav(); route(); }
else changeLang(startLang, false);
})();

</script>
