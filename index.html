<style>
/* ---------- tokens ---------- */
:root {
  --bg: #F3F5F8; --paper: #FFFFFF; --sunken: #E9EDF3; --ink: #141B2B; --ink-2: #435067; --ink-3: #6B778C;
  --rule: #D3DAE4; --rule-soft: #E3E8EF; --grid: rgba(35, 64, 184, 0.06);
  --accent: #2340B8; --accent-2: #1A3194; --accent-soft: #E3E8FA; --on-accent: #FFFFFF;
  --good: #17774A; --good-soft: #DDF1E5; --bad: #B3261E; --bad-soft: #FBE3E0; --warn: #8F5200; --warn-soft: #FBEFD9;
  --lv1: #C2410C; --lv2: #0F766E; --lv3: #6D28D9; --lv4: #B91C1C; --lv5: #1D4ED8; --lv6: #946000; --lv7: #A21D4E; --lv8: #4D7C0F;
  --f-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --f-body: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
  --top: 56px; --side: 292px;
  --shadow: 0 1px 2px rgba(20, 27, 43, 0.05), 0 10px 30px -18px rgba(20, 27, 43, 0.35);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0E131B; --paper: #151C27; --sunken: #1B2331; --ink: #E7EBF2; --ink-2: #AEB8C8; --ink-3: #8390A4;
    --rule: #2A3446; --rule-soft: #212A39; --grid: rgba(143, 166, 255, 0.05);
    --accent: #8EA4FF; --accent-2: #B4C2FF; --accent-soft: #1E2847; --on-accent: #0E131B;
    --good: #5FCB8F; --good-soft: #15281E; --bad: #FF8E82; --bad-soft: #33191A; --warn: #F2B35C; --warn-soft: #2E2413;
    --lv1: #FB8B52; --lv2: #34CDB8; --lv3: #C4A5FF; --lv4: #FF8A80; --lv5: #8EB4FF; --lv6: #F2C14E; --lv7: #F58BB0; --lv8: #A3D96B;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 30px -18px rgba(0, 0, 0, 0.7);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0E131B; --paper: #151C27; --sunken: #1B2331; --ink: #E7EBF2; --ink-2: #AEB8C8; --ink-3: #8390A4;
  --rule: #2A3446; --rule-soft: #212A39; --grid: rgba(143, 166, 255, 0.05);
  --accent: #8EA4FF; --accent-2: #B4C2FF; --accent-soft: #1E2847; --on-accent: #0E131B;
  --good: #5FCB8F; --good-soft: #15281E; --bad: #FF8E82; --bad-soft: #33191A; --warn: #F2B35C; --warn-soft: #2E2413;
  --lv1: #FB8B52; --lv2: #34CDB8; --lv3: #C4A5FF; --lv4: #FF8A80; --lv5: #8EB4FF; --lv6: #F2C14E; --lv7: #F58BB0; --lv8: #A3D96B;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 30px -18px rgba(0, 0, 0, 0.7);
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16.5px/1.6 var(--f-body); }
a { color: var(--accent); }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.15; text-wrap: balance; margin: 0; color: var(--ink); }
code { font: 0.88em var(--f-mono); background: var(--sunken); padding: 0.1em 0.35em; border-radius: 4px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.print-only { display: none; }
svg { flex: none; }
.btn svg, .key-toggle svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
mjx-container { font-size: 104% !important; }
mjx-container[display="true"] { overflow-x: auto; overflow-y: hidden; max-width: 100%; padding-block: 2px; }
.fbm { font-family: 'Cambria Math', 'Times New Roman', serif; font-style: italic; white-space: nowrap; }
.fbm-d { display: block; text-align: center; margin: 0.6em 0; white-space: normal; }

/* ---------- top bar & shell ---------- */
.topbar {
  position: sticky; top: 0; z-index: 30; height: calc(var(--top) + env(safe-area-inset-top, 0px));
  padding: env(safe-area-inset-top, 0px) 16px 0; display: flex; align-items: center; gap: 12px;
  background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--rule);
}
.brand { display: flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; font: 800 1.2rem var(--f-display); letter-spacing: -0.01em; }
.brand svg { width: 28px; height: 28px; }
.brand small { font: 500 0.72rem var(--f-mono); color: var(--ink-3); letter-spacing: 0.04em; margin-inline-start: 4px; }
.menu-btn { display: none; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); border-radius: 8px; width: 40px; height: 40px; align-items: center; justify-content: center; cursor: pointer; }
.menu-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.shell { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); align-items: start; }
.sidebar {
  position: sticky; top: calc(var(--top) + env(safe-area-inset-top, 0px)); height: calc(100vh - var(--top) - env(safe-area-inset-top, 0px));
  overflow-y: auto; border-inline-end: 1px solid var(--rule); padding: 16px 12px 48px; background: var(--bg); scrollbar-width: thin;
}
.search { position: relative; margin-bottom: 14px; }
.search input { width: 100%; font: 15px var(--f-body); color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; padding: 9px 12px; }
.search input::placeholder { color: var(--ink-3); }
.nav-level + .nav-level { margin-top: 18px; }
.nav-level-title { display: flex; align-items: center; gap: 10px; font: 700 0.95rem var(--f-display); padding: 4px 6px 6px; }
.nav-level-title small { display: block; font: 500 0.7rem var(--f-mono); color: var(--ink-3); letter-spacing: 0.06em; text-transform: uppercase; }
.rung { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 5px; background: var(--lv); color: var(--paper); font: 700 0.75rem var(--f-mono); flex: none; }
.rung-lg { width: 36px; height: 36px; font-size: 1rem; border-radius: 8px; }
.nav-topics { list-style: none; margin: 0; padding: 0; }
.nav-topics a { display: flex; gap: 10px; align-items: baseline; padding: 5px 8px; border-radius: 6px; color: var(--ink-2); text-decoration: none; font-size: 0.92rem; line-height: 1.35; }
.nav-topics a:hover { background: var(--sunken); color: var(--ink); }
.nav-topics a[aria-current="page"] { background: var(--paper); color: var(--ink); box-shadow: inset 3px 0 0 var(--lv), var(--shadow); font-weight: 700; }
.nav-topics .num { font: 500 0.72rem var(--f-mono); color: var(--ink-3); min-width: 1.4rem; }
.nav-review { font-style: italic; }
.main { padding: 32px clamp(16px, 4vw, 56px) 96px; min-width: 0; }
.scrim { display: none; }

/* ---------- buttons & controls ---------- */
.btn { display: inline-flex; align-items: center; gap: 8px; font: 700 0.92rem var(--f-body); padding: 9px 16px; border-radius: 8px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); text-decoration: none; cursor: pointer; transition: background 0.15s, border-color 0.15s; }
.btn:hover { border-color: var(--ink-3); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
.btn-ghost { background: transparent; }
.btn-small { padding: 6px 12px; font-size: 0.85rem; }
.eyebrow { display: flex; align-items: center; gap: 10px; font: 500 0.76rem var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--lv, var(--accent)); margin: 0 0 12px; }
.lede { color: var(--ink-2); font-size: 1.08rem; max-width: 62ch; margin: 12px 0 0; }

/* ---------- home ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: clamp(24px, 4vw, 56px); align-items: center; max-width: 1180px; margin: 0 auto 48px; }
.hero h1 { font-size: clamp(2.1rem, 1.3rem + 3vw, 3.5rem); font-weight: 800; letter-spacing: -0.025em; }
.hero-cta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
.sample { background: var(--paper); border: 1px solid var(--rule); border-radius: 10px; padding: 20px 22px; box-shadow: var(--shadow); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 22px 22px; min-height: 200px; }
.sample-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.sample-label { font: 500 0.72rem var(--f-mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); }
.sample-topic { font: 600 0.78rem var(--f-mono); color: var(--lv); text-decoration: none; }
.sample-q { font-size: 1.05rem; }
.sample-choices { list-style: none; padding: 0; margin: 14px 0 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 8px; }
.sample-choices li { display: flex; align-items: center; gap: 10px; }
.sample-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.sample-ans { margin-top: 12px; border-top: 1px dashed var(--rule); }
.sample-answer { margin: 12px 0 4px; } .sample-sol { margin: 0; color: var(--ink-2); font-size: 0.95rem; }
.reveal.collapsed { height: 0; overflow: hidden; visibility: hidden; margin: 0; padding: 0; border: 0; }
.ladder { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); gap: 16px; }
.level { background: var(--paper); border: 1px solid var(--rule); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; }
.level-head { display: flex; gap: 12px; align-items: center; }
.level-head h2 { font-size: 1.25rem; }
.band { margin: 2px 0 0; font: 500 0.74rem var(--f-mono); color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.05em; }
.level-blurb { color: var(--ink-2); font-size: 0.93rem; margin: 12px 0; }
.level-topics { margin: 0 0 14px; padding-inline-start: 1.4em; padding-inline-end: 0; font-size: 0.93rem; flex: 1; }
.level-topics li { padding: 2px 0; } .level-topics li::marker { color: var(--ink-3); font: 0.8em var(--f-mono); }
.level-topics a { color: var(--ink); text-decoration: none; } .level-topics a:hover { color: var(--lv); text-decoration: underline; }
.level-review { font-weight: 700; color: var(--lv); text-decoration: none; font-size: 0.92rem; }

/* ---------- topic ---------- */
.topic { max-width: 880px; margin: 0 auto; }
.crumbs { display: flex; gap: 8px; font: 0.8rem var(--f-mono); color: var(--ink-3); margin-bottom: 18px; }
.crumbs a { color: var(--ink-3); }
.topic-head h1 { font-size: clamp(2rem, 1.4rem + 2.2vw, 3rem); font-weight: 800; letter-spacing: -0.02em; }
.topic-tabs { display: flex; gap: 4px; margin-top: 26px; border-bottom: 1px solid var(--rule); }
.topic-tabs a { padding: 10px 18px; font: 700 0.98rem var(--f-display); color: var(--ink-3); text-decoration: none; border-bottom: 3px solid transparent; margin-bottom: -1px; }
.topic-tabs a:hover { color: var(--ink); }
.topic-tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--lv); }
#panel { margin-top: 28px; }

/* ---------- lesson prose ---------- */
.lesson-tools { display: flex; justify-content: flex-end; margin: -12px 0 8px; }
.prose { max-width: 70ch; }
.rungs { max-width: 70ch; margin: 0 0 28px; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); }
.rungs summary { display: flex; align-items: center; gap: 8px; padding: 10px 14px; cursor: pointer; list-style: none; font: 600 0.78rem var(--f-mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-2); }
.rungs summary::-webkit-details-marker { display: none; }
.rungs summary .chev { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; transform: rotate(-90deg); transition: transform 0.2s; }
[dir="rtl"] .rungs summary .chev { transform: rotate(90deg); }
.rungs[open] summary .chev { transform: none; }
.rungs summary:hover { color: var(--ink); }
.rungs-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 24px; padding: 4px 16px 16px; }
.rungs-col ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.rungs-col li a { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; color: var(--ink); text-decoration: none; }
.rungs-col li a:hover span:last-child { color: var(--lv); text-decoration: underline; }
.rungs-col li p { margin: 3px 0 0; font-size: 0.9rem; line-height: 1.5; color: var(--ink-2); }
.rungs-empty { margin: 0; font-size: 0.9rem; color: var(--ink-3); }
@media (max-width: 640px) { .rungs-cols { grid-template-columns: minmax(0, 1fr); } }
.prose > p, .prose li { color: var(--ink); }
.prose h3 { font-size: 1.3rem; margin: 2em 0 0.5em; }
.prose h3:first-child { margin-top: 0; }
.prose ul, .prose ol { padding-inline-start: 1.3em; padding-inline-end: 0; }
.prose li + li { margin-top: 4px; }
.box { margin: 1.4em 0; padding: 14px 18px; border-radius: 8px; }
.box > :last-child { margin-bottom: 0; } .box > p:first-of-type { margin-top: 0; }
.box-label { font: 600 0.72rem var(--f-mono) !important; text-transform: uppercase; letter-spacing: 0.08em; margin: 0 0 6px !important; }
.box-key { background: var(--accent-soft); } .box-key .box-label { color: var(--accent); }
.box-ex { border: 1.5px dashed var(--rule); background: var(--paper); } .box-ex .box-label { color: var(--ink-3); }
.box-tip { background: var(--warn-soft); } .box-tip .box-label { color: var(--warn); }
.formula { margin: 1em 0; padding: 4px 8px; overflow-x: auto; }
.tbl-wrap { overflow-x: auto; margin: 1em 0; }
.tbl { border-collapse: collapse; font-size: 0.93rem; min-width: 100%; background: var(--paper); font-variant-numeric: tabular-nums; }
.tbl th, .tbl td { border: 1px solid var(--rule); padding: 7px 10px; text-align: start; vertical-align: middle; }
.tbl thead th, .tbl-q th { background: var(--sunken); font-weight: 700; }
.tbl-q { min-width: 0; width: auto; } .tbl-q td, .tbl-q th { text-align: center; }
.fig { margin: 1.4em 0; } .fig > svg { width: 100%; max-width: 520px; height: auto; display: block; }   /* direct child only: MathJax output in a caption is SVG too */
.fig figcaption { font-size: 0.85rem; color: var(--ink-3); margin-top: 6px; }
.fig-shape { fill: var(--accent-soft); stroke: var(--ink-2); stroke-width: 1.5; }
.fig-alpha { fill-opacity: 0.55; }
.fig-line { fill: none; stroke: var(--ink-2); stroke-width: 1.5; }
.fig-dash { stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 5 4; }
.fig-frame { fill: none; stroke: var(--rule); stroke-width: 1.5; }
.fig-sector { fill: var(--accent-soft); stroke: none; }
.fig-dot { fill: var(--ink); }
.fig-text { fill: var(--ink); font: italic 600 15px var(--f-body); }
.fig-small { fill: var(--ink-2); font: 12px var(--f-body); }
.lesson-foot { margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--rule); display: grid; gap: 20px; }
.lesson-foot > .btn { justify-self: start; }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pager a { display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); color: var(--ink); text-decoration: none; font-weight: 700; }
.pager a:hover { border-color: var(--ink-3); }
.pager small { font: 500 0.72rem var(--f-mono); color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.06em; }
.pager-next { text-align: end; }

/* ---------- worksheet ---------- */
.ws-controls { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: flex-end; margin-bottom: 18px; }
.ctrl { display: flex; flex-direction: column; gap: 6px; }
.ctrl-label { font: 600 0.72rem var(--f-mono); text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-3); }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; background: var(--paper); }
.seg-btn { font: 600 0.9rem var(--f-mono); border: 0; background: transparent; color: var(--ink-2); padding: 8px 13px; cursor: pointer; }
.seg-btn + .seg-btn { border-left: 1px solid var(--rule); }
.seg-btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
select { font: 15px var(--f-body); color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px; }
.ctrl-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-inline-start: auto; }
.sheet {
  background-color: var(--paper); border: 1px solid var(--rule); border-radius: 6px; box-shadow: var(--shadow);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px; padding: clamp(18px, 3.5vw, 40px);
}
.sheet-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px 24px; padding-bottom: 16px; border-bottom: 2px solid var(--ink); }
.kicker { font: 600 0.72rem var(--f-mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--lv, var(--ink-3)); margin: 0 0 4px; }
.sheet-title h2 { font-size: 1.6rem; }
.sheet-meta { display: flex; gap: 18px; margin: 0; align-self: flex-end; }
.sheet-meta div { display: flex; flex-direction: column; }
.sheet-meta dt { font: 500 0.66rem var(--f-mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); }
.sheet-meta dd { margin: 0; font: 600 0.92rem var(--f-mono); }
.sheet-note { font-size: 0.86rem; color: var(--ink-3); margin: 14px 0 0; }
.qs { list-style: none; margin: 0; padding: 0; }
.q { padding: 22px 0; border-bottom: 1px solid var(--rule-soft); }
.q-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
.q-num { display: inline-grid; place-items: center; min-width: 28px; height: 28px; padding: 0 6px; border-radius: 50%; border: 1.5px solid var(--ink); font: 700 0.85rem var(--f-mono); flex: none; }
.q-type, .q-topic { font: 500 0.7rem var(--f-mono); text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-3); }
.q-topic { color: var(--lv); }
.q-text { font-size: 1.04rem; overflow-x: auto; }
.q-text .tbl-wrap { margin: 10px 0; }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); gap: 8px; margin-top: 12px; }
.choice { position: relative; display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); cursor: pointer; transition: border-color 0.15s, background 0.15s; }
.choice:hover { border-color: var(--ink-3); }
.choice input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.choice-body { min-width: 0; overflow-x: auto; }
.letter { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--ink-3); font: 600 0.8rem var(--f-mono); color: var(--ink-2); flex: none; background: var(--paper); }
.choice.sel { border-color: var(--accent); background: var(--accent-soft); }

    for (let i = 0; i < 6; i++) d += ` L ${x1 + (i % 2 ? 7 : -7)} ${s0 + (i + 0.5) * 6}`;
    d += ` L ${x1} ${s0 + zl} V ${y2}`; lx = x1 + 14; ly = (y1 + y2) / 2 + 5;

function battery(x, y1, y2, name) {
  const m = (y1 + y2) / 2;
  return `<path class="fig-wire" d="M ${x} ${y1} V ${m - 5} M ${x} ${m + 5} V ${y2}"/><line class="fig-wire" x1="${x - 16}" y1="${m - 5}" x2="${x + 16}" y2="${m - 5}"/><line class="fig-wire" style="stroke-width:4" x1="${x - 8}" y1="${m + 5}" x2="${x + 8}" y2="${m + 5}"/>` + txt(x - 22, m + 4, name, 'fig-small', 'end');
}
const wire = d => `<path class="fig-wire" d="${d}"/>`;
const node = (x, y) => `<circle class="fig-dot" cx="${x}" cy="${y}" r="3.2"/>`;
/* layout 'series': ε with R1…Rn in a loop; 'parallel': ε with R1…Rn side by side; 'mixed': R1 in series with (R2 ∥ R3) */
function circuitSvg(kind, names, emfName, label) {
  const W = 420, H = 230, L = 70, R = 380, Tp = 40, Bt = 200;
  let s = svgOpen(W, H, label) + battery(L, Tp, Bt, emfName);
  if (kind === 'series') {
    const n = names.length;
    if (n <= 2) {
      s += resistor(L, Tp, (L + R) / 2 + 10, Tp, names[0]) + wire(`M ${(L + R) / 2 + 10} ${Tp} H ${R} V ${Tp + 20}`);
      s += n === 2 ? resistor(R, Tp + 20, R, Bt - 20, names[1]) + wire(`M ${R} ${Bt - 20} V ${Bt} H ${L}`) : wire(`M ${R} ${Tp + 20} V ${Bt} H ${L}`);
    } else {
      const seg = (R - L) / 2;
      s += resistor(L, Tp, L + seg, Tp, names[0]) + resistor(L + seg, Tp, R, Tp, names[1]) + resistor(R, Tp, R, Bt, names[2]) + wire(`M ${R} ${Bt} H ${L}`);
    }
  } else if (kind === 'parallel') {
    const n = names.length, xs = names.map((_, i) => L + ((R - L) * (i + 1)) / n);
    s += wire(`M ${L} ${Tp} H ${R} M ${L} ${Bt} H ${R}`);
    xs.forEach((x, i) => { s += resistor(x, Tp, x, Bt, names[i]) + node(x, Tp) + node(x, Bt); });
  } else {   // mixed
    const xa = 250, xb = 360;
    s += resistor(L, Tp, 190, Tp, names[0]) + wire(`M 190 ${Tp} H ${xb} M ${L} ${Bt} H ${xb}`);
    s += resistor(xa, Tp, xa, Bt, names[1]) + resistor(xb, Tp, xb, Bt, names[2]) + node(xa, Tp) + node(xa, Bt);
  }
  return s + '</svg>';
}

<p>A vector is drawn as an arrow. Its length shows the <b>magnitude</b> and the arrowhead shows the <b>direction</b>. In print a vector is written in bold, $\mathbf{F}$, or with an arrow, $\vec{F}$; its magnitude is written $F$ or $|\vec{F}|$.</p>
<h3>Components</h3>
<p>A vector of magnitude $A$ at angle $\theta$ above the positive $x$-axis can be split into two perpendicular parts:</p>
${Fm(T`A_x = A\cos\theta \qquad A_y = A\sin\theta`)}

<h3>Adding vectors</h3>
<p>To add vectors, place them head to tail; the <b>resultant</b> runs from the first tail to the last head.</p>
<ul><li>Same direction: add the magnitudes. $3\,\mathrm{N} + 4\,\mathrm{N}$ to the right gives $7\,\mathrm{N}$ to the right.</li><li>Opposite directions: subtract, and the resultant points the way of the larger one.</li><li>Perpendicular: use Pythagoras. $3\,\mathrm{N}$ east and $4\,\mathrm{N}$ north give $\sqrt{3^2 + 4^2} = 5\,\mathrm{N}$.</li></ul>

<p>To describe motion along a line we choose a starting point and a positive direction. Then every position is a number, and every change of position is a <b>displacement</b>.</p>
<h3>Distance and displacement, speed and velocity</h3>
<ul><li><b>Distance</b> is the total length of the path (a scalar). <b>Displacement</b> is the change in position, with a direction (a vector). Walk $5\,\mathrm{m}$ forward and $5\,\mathrm{m}$ back: distance $10\,\mathrm{m}$, displacement $0$.</li>
<li><b>Average speed</b> $=\dfrac{\text{distance}}{\text{time}}$ and <b>average velocity</b> $=\dfrac{\text{displacement}}{\text{time}}$.</li></ul>
<h3>Uniform motion</h3>
<p>If the velocity is constant, the object covers equal distances in equal times:</p>
${Fm(T`s = v\,t`)}
<h3>Acceleration</h3>
<p><b>Acceleration</b> is the rate of change of velocity. Its unit is $\mathrm{m/s}$ per second, written $\mathrm{m/s^2}$:</p>
${Fm(T`a = \frac{\Delta v}{\Delta t} = \frac{v - v_0}{t}`)}

  blurb: 'Inertia, F = ma, action and reaction, weight and normal force, free-body diagrams, lifts and connected objects.',
  lesson: () => T`
<p>A <b>force</b> is a push or a pull, measured in newtons ($\mathrm{N}$). Newton's three laws link forces to motion.</p>
<h3>First law: inertia</h3>
<p>An object stays at rest, or keeps moving at constant velocity, unless a resultant (net) force acts on it. A passenger lurches forward when a bus brakes because their body tends to keep moving.</p>
<h3>Second law: $F = ma$</h3>
${Fm(T`\Sigma F = m a`)}
<p>The <b>net force</b> $\Sigma F$ is the vector sum of all forces on the object. A larger net force gives a larger acceleration; a larger mass gives a smaller one. $1\,\mathrm{N}$ is the force that gives $1\,\mathrm{kg}$ an acceleration of $1\,\mathrm{m/s^2}$.</p>
<h3>Third law: action and reaction</h3>
<p>If body A pushes on body B, then B pushes back on A with a force of equal size in the opposite direction. The two forces act on <b>different</b> bodies, so they never cancel each other.</p>
<h3>Common forces</h3>
<ul><li><b>Weight</b> $W = mg$, pulling towards the centre of the Earth.</li><li><b>Normal force</b> $N$, from a surface, perpendicular to it.</li><li><b>Tension</b> $T$, along a rope or string.</li><li><b>Friction</b> $f$, along a surface, against sliding (next topic).</li></ul>
${Key(T`<p>Solving a force problem:</p><ol><li>Draw a <b>free-body diagram</b>: the object alone, with every force on it as an arrow.</li><li>Choose a positive direction.</li><li>Write $\Sigma F = ma$ along that direction and solve.</li></ol>`)}
${Fig(fbdSvg([{ ang: 90, len: 70, label: 'N', kind: 'b' }, { ang: 270, len: 70, label: 'W' }, { ang: 0, len: 90, label: 'F' }, { ang: 180, len: 45, label: 'f', kind: 'c', ground: true }], T`Free-body diagram of a block pulled along the floor: normal force up, weight down, pull to the right and friction to the left`), T`A block pulled to the right: $N$ balances $W$, and the net force is $F - f$.`)}

  lesson: () => T`
<p><b>Friction</b> is the force between two surfaces that opposes sliding. It acts along the surface, against the motion (or against the motion that would happen without it).</p>
<h3>Static and kinetic friction</h3>
<ul><li><b>Static friction</b> holds an object still. It grows as you push harder, up to a maximum: $f_{s,\max} = \mu_s N$.</li><li><b>Kinetic friction</b> acts once the object slides: $f_k = \mu_k N$, roughly constant.</li></ul>
<p>$\mu_s$ and $\mu_k$ are the <b>coefficients of friction</b>. They have no unit, and usually $\mu_k \lt \mu_s$, which is why it is harder to start pushing a box than to keep it moving. On a level floor with no other vertical forces, $N = mg$.</p>
${Ex(T`<p>A $20\,\mathrm{kg}$ crate is pushed along a floor with $\mu_k = 0.3$ by a $100\,\mathrm{N}$ horizontal force ($g = 10\,\mathrm{m/s^2}$). Friction: $f = 0.3 \cdot 20 \cdot 10 = 60\,\mathrm{N}$. Net force: $100 - 60 = 40\,\mathrm{N}$, so $a = 40/20 = 2\,\mathrm{m/s^2}$.</p>`)}
<h3>Inclined planes</h3>
${Fig(inclineSvg(30, T`A block on a slope inclined at angle theta, with its weight, the normal force and friction`, true), T`On a slope the weight $mg$ is split into two components.`)}
${Key(T`<p>On a slope of angle $\theta$, split the weight into:</p><ul><li>along the slope: $mg\sin\theta$ (pulls the block down the slope)</li><li>perpendicular to the slope: $mg\cos\theta$ (balanced by the normal force, so $N = mg\cos\theta$)</li></ul><p>Sliding down a <b>smooth</b> slope: $a = g\sin\theta$.<br>Sliding down with kinetic friction: $a = g(\sin\theta - \mu_k\cos\theta)$.</p>`)}
<p>A block at rest stays put as long as $mg\sin\theta \le \mu_s mg\cos\theta$, that is, while $\tan\theta \le \mu_s$.</p>
${Tip(T`<p>The normal force on a slope is <b>not</b> $mg$; it is $mg\cos\theta$. Using $mg$ makes the friction too large.</p>`)}`,

<p><b>Energy</b> is the ability to do work, and <b>work</b> is energy transferred by a force. Both are measured in joules ($\mathrm{J}$).</p>
<h3>Work</h3>
${Fm(T`W = F\,s\cos\theta`)}
<p>Here $F$ is the force, $s$ the displacement and $\theta$ the angle between them. Only the part of the force along the motion does work. A force perpendicular to the motion (like the normal force on a level floor) does no work; a force against the motion (like friction) does negative work.</p>
<h3>Kinetic and potential energy</h3>
${Fm(T`E_k = \tfrac12 m v^2 \qquad E_p = m g h`)}
<p>Kinetic energy belongs to motion; gravitational potential energy to height above a chosen reference level.</p>
${Key(T`<p><b>Work–energy theorem:</b> the net work on an object equals its change in kinetic energy, $W_{\text{net}} = \Delta E_k$.</p><p><b>Conservation of mechanical energy:</b> if only gravity does work (no friction),</p><p>$$E_k + E_p = \text{constant}, \qquad \tfrac12 m v_1^2 + m g h_1 = \tfrac12 m v_2^2 + m g h_2.$$</p>`)}
${Ex(T`<p>A roller-coaster car starts from rest $20\,\mathrm{m}$ above the bottom of a smooth track ($g = 10\,\mathrm{m/s^2}$). At the bottom all the potential energy has become kinetic:</p><p>$$mgh = \tfrac12 m v^2 \;\Rightarrow\; v = \sqrt{2gh} = \sqrt{400} = 20\,\mathrm{m/s}.$$</p><p>The mass cancels, so every car reaches the same speed.</p>`)}
<h3>Power and efficiency</h3>
${Fm(T`P = \frac{W}{t} = F v \qquad \eta = \frac{\text{useful output}}{\text{input}} \times 100\%`)}
<p>Power is measured in watts: $1\,\mathrm{W} = 1\,\mathrm{J/s}$.</p>

  id: 'momentum', stage: 'sh', title: 'Momentum, Impulse & Collisions',
  blurb: 'Momentum and impulse, conservation of momentum, collisions that stick together, recoil and elastic collisions.',
  lesson: () => T`
<p>The <b>momentum</b> of an object is its mass times its velocity. It is a vector, pointing the same way as the velocity, and its unit is $\mathrm{kg\,m/s}$.</p>
${Fm(T`p = m v`)}
<h3>Impulse</h3>
<p>A force acting for a time changes the momentum. The product $F\,\Delta t$ is the <b>impulse</b>:</p>
${Fm(T`J = F\,\Delta t = \Delta p = m v - m v_0`)}
<p>This is why airbags and crumple zones save lives: spreading the same change of momentum over a longer time means a smaller force.</p>
${Key(T`<p><b>Conservation of momentum:</b> when no outside force acts on a system, its total momentum stays the same. For two objects colliding:</p><p>$$m_1 v_1 + m_2 v_2 = m_1 v_1' + m_2 v_2'.$$</p><p>Choose a positive direction and give velocities the other way a minus sign.</p>`)}
<h3>Types of collision</h3>
<ul><li><b>Perfectly inelastic:</b> the objects stick together and move off with one common velocity $v' = \dfrac{m_1 v_1 + m_2 v_2}{m_1 + m_2}$. Kinetic energy is lost (to heat, sound, deformation).</li><li><b>Elastic:</b> kinetic energy is conserved as well. When two equal masses collide elastically head-on, they swap velocities.</li><li>Most real collisions are in between: momentum is conserved, some kinetic energy is lost.</li></ul>
${Ex(T`<p>A $2\,\mathrm{kg}$ cart at $6\,\mathrm{m/s}$ hits a $1\,\mathrm{kg}$ cart at rest and they stick. $v' = \frac{2 \cdot 6 + 1 \cdot 0}{3} = 4\,\mathrm{m/s}$. Kinetic energy before: $36\,\mathrm{J}$; after: $\tfrac12 \cdot 3 \cdot 4^2 = 24\,\mathrm{J}$, so $12\,\mathrm{J}$ is lost.</p>`)}
<h3>Recoil</h3>
<p>Before a gun fires, the total momentum is zero, so afterwards the bullet's forward momentum is balanced by the gun's backward momentum: $m_b v_b = m_g v_g$.</p>
${Tip(T`<p>When a ball bounces back, its velocity changes sign. Bouncing from $+5\,\mathrm{m/s}$ to $-5\,\mathrm{m/s}$ is a change of $10\,\mathrm{m/s}$, not zero.</p>`)}`,

<h3>Temperature scales</h3>

<p>The heat needed to change the temperature of a mass $m$ by $\Delta T$ is</p>
${Fm(T`Q = m\,c\,\Delta T`)}
<p>where $c$ is the <b>specific heat capacity</b> of the material, in $\mathrm{J/(kg\,{}^\circ C)}$: the heat needed to warm $1\,\mathrm{kg}$ by $1^\circ\mathrm{C}$. Water has a very large value, about $4200\,\mathrm{J/(kg\,{}^\circ C)}$, which is why the sea warms and cools slowly.</p>

<p>A circuit is a closed loop through which charge can flow. The same two rules decide everything in a circuit of resistors.</p>
<h3>Series</h3>
${Fig(circuitSvg('series', ['R₁', 'R₂', 'R₃'], 'ε', circLabel()), T`Three resistors in series: one path for the current.`)}
<ul><li>The <b>same current</b> flows through every component.</li><li>The voltages add up: $V = V_1 + V_2 + V_3$.</li><li>The resistances add: $R_s = R_1 + R_2 + R_3$.</li></ul>
<h3>Parallel</h3>
${Fig(circuitSvg('parallel', ['R₁', 'R₂', 'R₃'], 'ε', circLabel()), T`Three resistors in parallel: the current splits between the branches.`)}
<ul><li>Every branch has the <b>same voltage</b>.</li><li>The currents add up: $I = I_1 + I_2 + I_3$.</li><li>$\dfrac{1}{R_p} = \dfrac{1}{R_1} + \dfrac{1}{R_2} + \dfrac{1}{R_3}$. For just two resistors: $R_p = \dfrac{R_1 R_2}{R_1 + R_2}$.</li></ul>
<p>The combined resistance of a parallel group is always smaller than its smallest resistor, because each extra branch gives the current another path.</p>
${Key(T`<p>For a mixed circuit, replace each parallel group by its equivalent resistance, then add the series parts. Find the total current from $I = V/R_{\text{total}}$, then work back through the circuit using $V = IR$ for each part.</p>`)}
${Ex(T`<p>$R_1 = 4\,\Omega$ in series with $R_2 = 6\,\Omega$ and $R_3 = 3\,\Omega$ in parallel, on a $12\,\mathrm{V}$ battery. $R_{23} = \frac{6 \cdot 3}{9} = 2\,\Omega$, total $6\,\Omega$, so $I = 2\,\mathrm{A}$. $V_1 = 8\,\mathrm{V}$, and the parallel pair gets $4\,\mathrm{V}$: $I_2 = \frac{4}{6} \approx 0.67\,\mathrm{A}$, $I_3 = \frac{4}{3} \approx 1.33\,\mathrm{A}$.</p>`)}
<h3>EMF and internal resistance</h3>
<p>A real battery has an <b>electromotive force</b> $\varepsilon$ (the energy it gives each coulomb) and a small <b>internal resistance</b> $r$. With an external resistance $R$:</p>
${Fm(T`I = \frac{\varepsilon}{R + r} \qquad V_{\text{terminal}} = \varepsilon - I r`)}
${Tip(T`<p><b>Kirchhoff's rules</b> summarise all of this: the currents into a junction equal the currents out, and around any closed loop the voltage rises equal the voltage drops.</p>`)}`,
  gens: [
    () => {

  if (LANG_FONTS[code]) {
    let l = $('#lang-font'); if (!l) { l = document.createElement('link'); l.id = 'lang-font'; l.rel = 'stylesheet'; document.head.appendChild(l); }
    const href = `https://fonts.googleapis.com/css2?family=${LANG_FONTS[code]}:wght@400;700;800&display=swap`;
    if (l.href !== href) l.href = href;
  }
  $('#menu-btn').setAttribute('aria-label', ui('showTopics'));
  $('#brand-tag').textContent = ui('brandTag');
  $('label[for="topic-search"]').textContent = ui('searchLabel');
  $('#lang-label').textContent = ui('language');
  updateThemeBtn();
  $('#lang-code').textContent = code.toUpperCase();
  langSel.value = code;
  updatePrintStyle();
}
async function changeLang(code, persist = true) {
  const ok = await loadPack(code);
  if (!ok) { toast(ui('langFail')); code = 'en'; }
  setLang(code);
  if (persist) store.set('lang', code);
  applyChrome();
  sheets.forEach((sh, id) => {   // same seed -> same numbers, now worded in the new language
    const fresh = makeSheet(TOPICS.get(id), sh.n, sh.mode, sh.seed);
    fresh.answers = sh.answers; fresh.checked = sh.checked; fresh.keyOpen = sh.keyOpen;
    sheets.set(id, fresh);
  });
  renderNav();
  if (current.view === 'home' && $('#sample')) { route(true); renderSample(false); } else route(true);
}
langSel.innerHTML = LANGS.map(([c, n]) => `<option value="${c}" lang="${HTML_LANG[c] || c}">${n}</option>`).join('');
langSel.addEventListener('change', () => changeLang(langSel.value));
function initialLang() {
  const codes = LANGS.map(l => l[0]);
  let q = null; try { q = new URLSearchParams(location.search).get('lang'); } catch (e) { /* no query */ }
  if (q && codes.includes(q)) return q;
  const saved = store.get('lang', null); if (saved && codes.includes(saved)) return saved;
  for (const l of navigator.languages || [navigator.language || 'en']) {
    const base = String(l).toLowerCase().split('-')[0].replace(/^in$/, 'id');
    if (codes.includes(base)) return base;
  }
  return 'en';
}

/* ---------------- events ---------------- */
main.addEventListener('toggle', e => { if (e.target.classList && e.target.classList.contains('rungs')) store.set('ladderOpen', e.target.open); }, true);
main.addEventListener('click', e => {
  const btn = e.target.closest('[data-act], .seg-btn'); if (!btn) return;
  const t = current.view === 'topic' ? TOPICS.get(current.id) : null;
  if (btn.classList.contains('seg-btn')) { settings.n = +btn.dataset.n; store.set('n', settings.n); renderPractice(t, true); return; }
  switch (btn.dataset.act) {
    case 'new': renderPractice(t, true); break;
    case 'check': checkSheet(true); break;
    case 'clear': { const sh = currentSheet(); sh.answers = {}; sh.checked = false; renderPractice(t); break; }
    case 'toggle-key': {
      const sh = currentSheet(); sh.keyOpen = !sh.keyOpen;
      $('#key-body').classList.toggle('collapsed', !sh.keyOpen);
      btn.setAttribute('aria-expanded', String(sh.keyOpen));
      btn.querySelector('span').textContent = ui(sh.keyOpen ? 'hideKey' : 'showKey');
      if (sh.keyOpen) $('#key-body').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      break;
    }
    case 'print-q': doPrint('questions'); break;
    case 'print-key': doPrint('key'); break;
    case 'print-both': doPrint('both'); break;
    case 'print-lesson': doPrint('lesson'); break;
    case 'sample-new': renderSample(); break;
    case 'sample-reveal': { const open = btn.getAttribute('aria-expanded') !== 'true'; btn.setAttribute('aria-expanded', String(open)); btn.textContent = ui(open ? 'hideAnswer' : 'showAnswer'); $('#sample-ans').classList.toggle('collapsed', !open); break; }
  }
});
main.addEventListener('change', e => {
  const el = e.target, t = current.view === 'topic' ? TOPICS.get(current.id) : null;
  if (el.id === 'mode-select') { settings.mode = el.value; store.set('mode', settings.mode); renderPractice(t, true); return; }
  if (el.type === 'radio') {
    const sh = currentSheet(), i = +el.dataset.i; sh.answers[i] = +el.value;
    el.closest('.choices').querySelectorAll('.choice').forEach(c => c.classList.toggle('sel', c.contains(el)));
  }
});
main.addEventListener('input', e => { const el = e.target; if (el.matches('.fill input')) { const sh = currentSheet(); sh.answers[+el.dataset.i] = el.value; } });
main.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('.fill input')) { const all = [...main.querySelectorAll('.q input[type="text"]')], k = all.indexOf(e.target); if (all[k + 1]) all[k + 1].focus(); } });

/* ---------------- boot ---------------- */
window.__mathLadder = { finalize, checkFill, canFill, TOPICS, changeLang, UI_EN };   // hook for self-tests
const startLang = initialLang();
if (startLang === 'en') { setLang('en'); applyChrome(); renderNav(); route(); }
else changeLang(startLang, false);
})();

</script>
</body>
